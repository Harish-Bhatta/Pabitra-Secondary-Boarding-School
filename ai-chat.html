<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="AI Chat Assistant - Pabitra Secondary Boarding School" />
    <meta name="theme-color" content="#f39c12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
    <link rel="icon" type="image/png" href="school.jpg" />
    <title>AI Chat — PSBS</title>
    <style>
        :root {
            --primary: #f39c12;
            --primary-dark: #d68910;
            --primary-light: #f5b041;
            --primary-gradient: linear-gradient(135deg, #f39c12, #f5b041);
            --background: #F8FAFC;
            --surface: rgba(255, 255, 255, 0.75);
            --surface-solid: #FFFFFF;
            --surface-hover: #F1F5F9;
            --text: #0F172A;
            --text-light: #64748B;
            --border: rgba(226, 232, 240, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            --radius-sm: 14px;
            --radius-md: 20px;
            --radius-lg: 26px;
            --radius-full: 9999px;
            --msg-radius: 22px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.12);
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --header-height: 58px;
            --chat-msg-user-bg: var(--primary-gradient);
            --chat-msg-user-color: #FFFFFF;
            --chat-msg-ai-bg: rgba(255, 255, 255, 0.9);
            --chat-msg-ai-color: var(--text);
            --z-header: 100;
            --z-sidebar: 200;
            --z-modal: 500;
            --z-toast: 1000;
            --z-dropdown: 300;
            --sb-width: 85vw;
            --sb-inner-padding: 14px;
            --container-padding: 16px;
        }

        body.dark {
            --background: #090D16;
            --surface: rgba(15, 23, 42, 0.85);
            --surface-solid: #0F172A;
            --surface-hover: #1E293B;
            --text: #F8FAFC;
            --text-light: #94A3B8;
            --border: rgba(51, 65, 85, 0.5);
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.03);
            --chat-msg-ai-bg: rgba(30, 41, 59, 0.9);
            --chat-msg-ai-color: #F8FAFC;
        }

        body.theme-cyan {
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --primary-light: #67e8f9;
            --primary-gradient: linear-gradient(135deg, #06b6d4, #67e8f9);
            --chat-msg-user-bg: var(--primary-gradient);
        }

        body.theme-coral {
            --primary: #e85d75;
            --primary-dark: #c0394b;
            --primary-light: #f1948a;
            --primary-gradient: linear-gradient(135deg, #e85d75, #f1948a);
            --chat-msg-user-bg: var(--primary-gradient);
        }

        body.theme-indigo {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --primary-gradient: linear-gradient(135deg, #4f46e5, #818cf8);
            --chat-msg-user-bg: var(--primary-gradient);
        }

        body.theme-rose {
            --primary: #e11d48;
            --primary-dark: #be123c;
            --primary-light: #fb7185;
            --primary-gradient: linear-gradient(135deg, #e11d48, #fb7185);
            --chat-msg-user-bg: var(--primary-gradient);
        }

        body.theme-teal {
            --primary: #27ae9e;
            --primary-dark: #1f8a7a;
            --primary-light: #48c9b0;
            --primary-gradient: linear-gradient(135deg, #27ae9e, #48c9b0);
            --chat-msg-user-bg: var(--primary-gradient);
        }

        body.theme-red {
            --primary: #e74c3c;
            --primary-dark: #c0392b;
            --primary-light: #f1948a;
            --primary-gradient: linear-gradient(135deg, #e74c3c, #f1948a);
            --chat-msg-user-bg: var(--primary-gradient);
        }

        body.theme-yellow {
            --primary: #f1c40f;
            --primary-dark: #d4ac0d;
            --primary-light: #f7dc6f;
            --primary-gradient: linear-gradient(135deg, #f1c40f, #f7dc6f);
            --chat-msg-user-bg: var(--primary-gradient);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-family);
            background: var(--background);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .nebula-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .nebula-bg .orb {
            position: absolute;
            border-radius: var(--radius-full);
            filter: blur(90px);
            animation: float 18s ease-in-out infinite alternate;
        }

        .nebula-bg .orb:nth-child(1) {
            width: 350px;
            height: 350px;
            top: -100px;
            left: -100px;
            background: rgba(243, 156, 18, 0.22);
        }

        .nebula-bg .orb:nth-child(2) {
            width: 300px;
            height: 300px;
            bottom: -80px;
            right: -80px;
            background: rgba(6, 182, 212, 0.18);
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -20px) scale(1.08);
            }
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            height: var(--header-height);
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid var(--border);
            z-index: var(--z-header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            flex-shrink: 0;
            gap: 6px;
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--glass-bg);
            color: var(--text);
            display: grid;
            place-items: center;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        .icon-btn:hover {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
        }

        .new-chat-btn {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
        }

        .home-btn-header {
            background: var(--glass-bg);
            border: 1px solid var(--border);
        }

        .header-theme-toggle-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--glass-bg);
            color: var(--text);
            display: grid;
            place-items: center;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .header-theme-toggle-btn:hover {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
        }

        .header-theme-presets-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--glass-bg);
            color: var(--text);
            display: grid;
            place-items: center;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .header-theme-presets-btn:hover {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
        }

        /* ===== PROFILE ===== */
        .profile-container {
            position: relative;
        }

        .profile-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-full);
            background: var(--primary-gradient);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            border: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }

        .profile-btn:active {
            transform: scale(0.9);
        }

        .profile-dropdown {
            position: absolute;
            top: 46px;
            right: 0;
            width: 280px;
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 6px 0;
            z-index: var(--z-dropdown);
            display: none;
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
        }

        body.dark .profile-dropdown {
            background: var(--surface-solid);
        }

        .profile-dropdown.active {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .dropdown-profile-header {
            padding: 10px 14px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-avatar-wrap {
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
            border-radius: var(--radius-full);
            transition: transform 0.3s ease;
        }

        .dropdown-avatar-wrap:hover {
            transform: scale(1.04);
        }

        .dropdown-avatar-wrap .avatar-edit-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 20px;
            height: 20px;
            border-radius: var(--radius-full);
            background: var(--primary);
            color: #fff;
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--surface-solid);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .dropdown-avatar {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            color: #fff;
            background-size: cover;
            background-position: center;
            background-color: var(--primary);
            flex-shrink: 0;
        }

        .dropdown-user-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .dropdown-user-meta .name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dropdown-user-meta .name-row h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-user-meta .name-row .edit-name-icon {
            font-size: 0.7rem;
            color: #fff;
            background: var(--primary);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 2px;
            border-radius: var(--radius-full);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }

        .dropdown-user-meta .name-row .edit-name-icon:hover {
            transform: scale(1.15);
        }

        .dropdown-user-meta span {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--primary);
            background: rgba(243, 156, 18, 0.08);
            padding: 1px 10px;
            border-radius: 16px;
            width: max-content;
        }

        .dropdown-divider {
            height: 1px;
            background: var(--border);
            margin: 4px 12px;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            color: var(--text);
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 100%;
            text-align: left;
            cursor: pointer;
            border: none;
            background: none;
            border-radius: 0;
        }

        .dropdown-item i {
            font-size: 0.9rem;
            color: var(--text-light);
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .dropdown-item:hover {
            background: rgba(243, 156, 18, 0.05);
            color: var(--primary);
        }

        .dropdown-item.danger {
            color: #EF4444;
        }

        .dropdown-item.danger:hover {
            background: rgba(239, 68, 68, 0.05);
            color: #EF4444;
        }

        .dropdown-item .login-role-tag {
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: rgba(243, 156, 18, 0.08);
            color: var(--primary);
            padding: 1px 8px;
            border-radius: 12px;
            margin-left: auto;
        }

        /* ===== SIDEBAR ===== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: calc(var(--z-sidebar) - 1);
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: var(--sb-width);
            max-width: 340px;
            background: var(--surface);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            border-right: 1px solid var(--glass-border);
            z-index: var(--z-sidebar);
            transform: translateX(-102%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            will-change: transform;
            box-shadow: 20px 0 60px rgba(15, 23, 42, 0.05);
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar.no-transition {
            transition: none !important;
        }

        .sidebar-header {
            padding: 6px var(--sb-inner-padding);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 56px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .sidebar-logo {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            object-fit: cover;
            flex-shrink: 0;
        }

        .sidebar-text h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
        }

        .sidebar-text p {
            font-size: 0.7rem;
            margin: 0;
            color: var(--text-light);
        }

        .sidebar-close {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            background: var(--glass-bg);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 16px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .sidebar-close:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            transform: rotate(90deg);
        }

        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px var(--sb-inner-padding);
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .sidebar-quick-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--glass-border);
        }

        .sidebar-nav-btn {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .sidebar-nav-btn:hover {
            background: rgba(243, 156, 18, 0.06);
            transform: translateX(2px);
        }

        .sidebar-nav-btn.primary-btn {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 16px rgba(243, 156, 18, 0.2);
        }

        .sidebar-nav-btn.primary-btn:hover {
            transform: translateX(2px) translateY(-1px);
            box-shadow: 0 6px 28px rgba(243, 156, 18, 0.35);
        }

        .sidebar-nav-btn .nav-icon {
            font-size: 1.2rem;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-nav-btn .nav-label {
            flex: 1;
        }

        .sidebar-nav-btn .nav-badge {
            font-size: 0.6rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 10px;
            border-radius: 999px;
            color: inherit;
        }

        .sidebar-group-title {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 4px;
            margin-top: 4px;
        }

        .sidebar-group-title span:first-child {
            font-size: 0.55rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-light);
            white-space: nowrap;
            opacity: 0.6;
        }

        .title-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
        }

        .sidebar-links {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-link-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 10px;
            border-radius: var(--radius-sm);
            color: var(--text);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .sidebar-link-btn:hover {
            background: rgba(243, 156, 18, 0.04);
            transform: translateX(2px);
        }

        .sidebar-link-btn .nav-icon-wrapper {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--text);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .sidebar-footer-wrap {
            padding: 8px var(--sb-inner-padding) 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            border-top: 1px solid var(--glass-border);
        }

        .glass-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border) 50%, transparent);
        }

        .footer-meta-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .spiritual-branding {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .heart-pulse-icon {
            color: #EC4899;
            font-size: 0.7rem;
            animation: heartbeat 1.4s ease infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.15);
            }
            60% {
                transform: scale(1.1);
            }
        }

        .gradient-signature-text {
            font-size: 0.6rem;
            font-weight: 700;
            background: linear-gradient(45deg, #EC4899, #4f46e5, #f39c12);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 4s linear infinite;
        }

        @keyframes gradientText {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ===== HISTORY ===== */
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .history-item:hover {
            background: var(--surface-hover);
            transform: translateX(2px);
        }

        .history-title {
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-title i {
            color: var(--text-light);
            font-size: 0.8rem;
        }

        .h-more-btn {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            border: none;
            background: transparent;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            z-index: 2;
            transition: all 0.2s ease;
        }

        .h-more-btn:hover {
            background: rgba(0, 0, 0, 0.06);
            color: var(--text);
        }

        .history-dropdown {
            position: absolute;
            right: 10px;
            top: 38px;
            width: 140px;
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-md);
            z-index: 50;
            display: none;
            padding: 4px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .history-dropdown.active {
            display: block;
        }

        .history-dropdown button {
            width: 100%;
            padding: 8px 10px;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 0.76rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .history-dropdown button:hover {
            background: var(--surface-hover);
        }

        .history-dropdown button.danger {
            color: #EF4444;
        }

        .history-dropdown button.danger:hover {
            background: rgba(239, 68, 68, 0.06);
        }

        /* ===== CHAT ===== */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            scroll-behavior: smooth;
        }

        .chat-msg {
            max-width: 88%;
            padding: 11px 17px;
            border-radius: var(--msg-radius);
            font-size: 0.88rem;
            line-height: 1.5;
            word-break: break-word;
            animation: fadeIn 0.25s ease-out forwards;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .chat-msg.user {
            align-self: flex-end;
            background: var(--chat-msg-user-bg);
            color: var(--chat-msg-user-color);
            border-bottom-right-radius: 8px;
            cursor: default;
        }

        .chat-msg.ai {
            align-self: flex-start;
            background: var(--chat-msg-ai-bg);
            color: var(--chat-msg-ai-color);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 8px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .chat-msg .msg-time {
            display: block;
            font-size: 0.6rem;
            opacity: 0.55;
            margin-top: 4px;
            text-align: right;
        }

        .chat-msg.user .msg-time {
            color: rgba(255, 255, 255, 0.7);
        }

        .chat-msg .msg-actions {
            display: none;
            gap: 6px;
            margin-top: 6px;
            justify-content: flex-end;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .chat-msg:hover .msg-actions {
            display: flex;
            opacity: 1;
        }

        .chat-msg .msg-actions button {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--glass-bg);
            color: var(--text-light);
            display: grid;
            place-items: center;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .chat-msg .msg-actions button:hover {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
            transform: scale(1.05);
        }

        .chat-msg.user .msg-actions button {
            color: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-msg.user .msg-actions button:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            border-color: transparent;
        }

        /* Long-press dropdown for user messages */
        .msg-context-menu {
            position: fixed;
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            padding: 4px;
            z-index: 100;
            min-width: 130px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            animation: fadeIn 0.15s ease-out;
        }

        .msg-context-menu.active {
            display: block;
        }

        .msg-context-menu button {
            width: 100%;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease;
            font-family: inherit;
        }

        .msg-context-menu button:hover {
            background: var(--surface-hover);
        }

        .msg-context-menu button i {
            font-size: 0.9rem;
            color: var(--text-light);
            width: 18px;
            text-align: center;
        }

        .chat-msg .regenerate-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--glass-bg);
            color: var(--text-light);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-family: inherit;
        }

        .chat-msg .regenerate-btn:hover {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
            transform: scale(1.02);
        }

        .chat-msg .regenerate-btn i {
            font-size: 0.8rem;
        }

        .chat-msg .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            margin-left: 4px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--glass-bg);
            color: var(--text-light);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-family: inherit;
        }

        .chat-msg .copy-btn:hover {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
            transform: scale(1.02);
        }

        .chat-msg .copy-btn i {
            font-size: 0.8rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .chat-welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            gap: 8px;
        }

        .welcome-avatar {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-full);
            background: var(--primary);
            color: #fff;
            font-size: 1.9rem;
            font-weight: 800;
            display: grid;
            place-items: center;
            background-size: cover;
            background-position: center;
            box-shadow: var(--shadow-md);
            border: 2px solid var(--glass-border);
            flex-shrink: 0;
        }

        .welcome-text-content h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .welcome-text-content p {
            font-size: 0.82rem;
            color: var(--text-light);
            max-width: 300px;
        }

        .chat-main.keyboard-open .welcome-text-content {
            opacity: 0;
            max-height: 0;
            margin: 0;
            overflow: hidden;
        }

        .chat-main.keyboard-open .chat-welcome {
            gap: 4px;
            justify-content: flex-start;
            padding-top: 200px;
        }

        .chat-main.keyboard-open .welcome-avatar {
            width: 80px;
            height: 80px;
            font-size: 1.3rem;
        }

        .chat-input-wrap {
            padding: 8px 10px max(10px, env(safe-area-inset-bottom));
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input-form {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
            position: relative;
        }

        .chat-textarea-wrap {
            flex: 1;
            position: relative;
        }

        .chat-textarea-wrap textarea {
            width: 100%;
            min-height: 44px;
            max-height: 130px;
            padding: 11px 18px;
            border-radius: 24px;
            border: 1.5px solid var(--border);
            background: var(--surface-solid);
            color: var(--text);
            font-size: 0.92rem;
            outline: none;
            font-family: inherit;
            resize: none;
            line-height: 1.4;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: var(--shadow-sm);
            -webkit-user-select: text;
            user-select: text;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chat-textarea-wrap textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3.5px rgba(243, 156, 18, 0.12);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            border: none;
            background: var(--primary-gradient);
            color: #fff;
            font-size: 1.2rem;
            display: grid;
            place-items: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(243, 156, 18, 0.2);
            transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.3s ease;
            align-self: flex-end;
            margin-bottom: 1px;
        }

        .send-btn:active {
            transform: scale(0.9);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn:hover:not(:disabled) {
            box-shadow: 0 6px 28px rgba(243, 156, 18, 0.35);
            transform: translateY(-1px);
        }

        .typing-indicator {
            align-self: flex-start;
            display: flex;
            gap: 4px;
            padding: 11px 17px;
            background: var(--chat-msg-ai-bg);
            border-radius: var(--msg-radius);
            border-bottom-left-radius: 8px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: var(--radius-full);
            background: var(--text-light);
            animation: bounce 1.2s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-6px);
            }
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px) scale(0.92);
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            color: var(--text);
            padding: 12px 20px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: var(--z-toast);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 160px;
            justify-content: center;
        }

        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
            pointer-events: auto;
        }

        .toast .toast-icon {
            font-size: 1.1rem;
        }

        /* ===== MODALS ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            z-index: var(--z-modal);
            display: none;
            place-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: grid;
        }

        .modal-card {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            padding: 24px 20px;
            box-shadow: var(--shadow-xl);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            opacity: 0;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-close {
            border: none;
            background: var(--glass-bg);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            display: grid;
            place-items: center;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            transform: rotate(90deg);
        }

        .modal-input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text);
            margin-bottom: 14px;
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s ease;
        }

        .modal-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.1);
        }

        .modal-save-btn {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 12px;
            background: var(--primary-gradient);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(243, 156, 18, 0.2);
        }

        .modal-save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(243, 156, 18, 0.35);
        }

        /* ===== THEME PRESETS MODAL ===== */
        .theme-presets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 12px 0;
        }

        .theme-option {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .theme-option:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .theme-option.active-theme {
            border-color: var(--primary);
            background: rgba(243, 156, 18, 0.04);
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.08);
        }

        .theme-option .theme-swatch {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            margin: 0 auto 4px;
            border: 2px solid var(--border);
            transition: transform 0.3s ease;
        }

        .theme-option:hover .theme-swatch {
            transform: scale(1.06);
        }

        .theme-option .theme-name {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text);
        }

        .theme-option .theme-check {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            border-radius: var(--radius-full);
            background: var(--primary);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
        }

        .theme-option.active-theme .theme-check {
            display: flex;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 600px) {
            .chat-messages {
                padding: 20px 12%;
            }
            .chat-input-wrap {
                padding: 10px 12% max(12px, env(safe-area-inset-bottom));
            }
            .chat-msg {
                max-width: 70%;
            }
            .toast {
                min-width: 200px;
            }
        }

        @media (min-width: 768px) {
            .chat-messages {
                padding: 24px 18%;
            }
            .chat-input-wrap {
                padding: 12px 18% max(14px, env(safe-area-inset-bottom));
            }
            .chat-msg {
                max-width: 65%;
            }
        }

        @media (min-width: 1024px) {
            .chat-messages {
                padding: 28px 22%;
            }
            .chat-input-wrap {
                padding: 14px 22% max(16px, env(safe-area-inset-bottom));
            }
            .chat-msg {
                max-width: 55%;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* ===== UTILITY ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="nebula-bg" aria-hidden="true">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div id="toast" class="toast" role="alert">
        <span class="toast-icon">✅</span>
        <span id="toastMsg"></span>
    </div>

    <!-- Edit Name Modal -->
    <div class="modal-overlay" id="editNameModal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">✏️ Edit Name</span>
                <button class="modal-close" id="editNameCloseBtn"><i class="ri-close-line"></i></button>
            </div>
            <input type="text" class="modal-input" id="editNameInput" placeholder="Enter your name" autocomplete="off" />
            <button class="modal-save-btn" id="saveNameBtn">Save Changes</button>
        </div>
    </div>

    <!-- Rename Chat Modal -->
    <div class="modal-overlay" id="renameChatModal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">✏️ Rename Chat</span>
                <button class="modal-close" id="renameChatCloseBtn"><i class="ri-close-line"></i></button>
            </div>
            <input type="text" class="modal-input" id="renameChatInput" placeholder="Enter new chat title"
                autocomplete="off" />
            <button class="modal-save-btn" id="saveRenameChatBtn">Save Title</button>
        </div>
    </div>

    <!-- Theme Presets Modal -->
    <div class="modal-overlay" id="themePresetsModal">
        <div class="modal-card" style="max-width:380px;">
            <div class="modal-header">
                <span class="modal-title">🎨 Theme Presets</span>
                <button class="modal-close" id="themePresetsCloseBtn"><i class="ri-close-line"></i></button>
            </div>
            <p style="font-size:0.8rem;color:var(--text-light);margin-bottom:4px;">Choose a color theme that suits your
                style.</p>
            <div class="theme-presets-grid" id="themePresetsGrid"></div>
            <button class="modal-save-btn" id="themePresetsApplyBtn">Apply Theme</button>
        </div>
    </div>

    <input type="file" id="avatarUploader" accept="image/*" style="display:none;" />

    <div id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="nav-left">
                <button class="icon-btn" id="menuBtn" aria-label="Open Navigation Sidebar">
                    <i class="ri-menu-line"></i>
                </button>
                <img src="school.jpg" alt="Logo"
                    style="width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;"
                    onerror="this.style.display='none'" />
                <button class="icon-btn new-chat-btn" id="newChatBtn" title="Start New Chat">
                    <i class="ri-edit-box-line"></i>
                </button>
            </div>
            <div class="nav-right">
                <a href="index.html" class="icon-btn home-btn-header" title="Main Portal Home" aria-label="Home">
                    <i class="ri-home-4-line"></i>
                </a>
                <button class="header-theme-toggle-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode">
                    <i class="ri-moon-line"></i>
                </button>

        // ============================================================

        let swipeState = {

        function getSidebarWidth() {

        function setSidebarTranslate(tx) {

            DOM.sidebarOverlay.style.visibility = progress > 0.01 ? 'visible' : 'hidden';

        function openSidebar() {

        // --- Touch handlers with global swipe detection ---
        document.addEventListener('touchstart', function(e) {
            if (swipeState.isSwiping) return;
            const touch = e.touches[0];
            swipeState.startX = touch.clientX;
            swipeState.startY = touch.clientY;
            swipeState.isVertical = false;
            swipeState.isSwiping = false;
            swipeState.sidebarDrag = null;
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (swipeState.isSwiping && swipeState.sidebarDrag) {
                // We're already dragging the sidebar
                const touch = e.touches[0];
                const deltaX = touch.clientX - swipeState.sidebarDrag.startX;
                const sw = getSidebarWidth();
                let newTranslate = swipeState.sidebarDrag.startTranslate + deltaX;
                newTranslate = Math.max(-sw, Math.min(0, newTranslate));
                setSidebarTranslate(newTranslate);
                e.preventDefault();
                return;
            }

            // Not yet swiping; determine if this is a horizontal swipe
            const touch = e.touches[0];
            const deltaX = touch.clientX - swipeState.startX;
            const deltaY = touch.clientY - swipeState.startY;

            // If vertical movement is more than horizontal, treat as scroll
            if (Math.abs(deltaY) > Math.abs(deltaX) * 1.2 && Math.abs(deltaY) > 15) {
                swipeState.isVertical = true;
                return;
            }

            // Check for horizontal swipe with low threshold
            if (Math.abs(deltaX) > 25 && !swipeState.isVertical) {
                const sw = getSidebarWidth();
                const isOpen = state.isSidebarOpen;

                // Swipe right to open, swipe left to close
                if (deltaX > 0 && !isOpen) {
                    // Opening
                    swipeState.sidebarDrag = {
                        startX: touch.clientX,
                        startTranslate: -sw,
                        type: 'opening'
                    };
                    swipeState.isSwiping = true;
                    DOM.sidebar.classList.add('no-transition');
                    DOM.sidebarOverlay.style.visibility = 'visible';
                    DOM.sidebarOverlay.style.opacity = '0';
                    e.preventDefault();
                } else if (deltaX < 0 && isOpen) {
                    // Closing
                    swipeState.sidebarDrag = {
                        startX: touch.clientX,
                        startTranslate: 0,
                        type: 'closing'
                    };
                    swipeState.isSwiping = true;
                    DOM.sidebar.classList.add('no-transition');
                    e.preventDefault();
                } else {
                    // Swipe in wrong direction or sidebar state mismatch - ignore
                    swipeState.isSwiping = false;
                    swipeState.sidebarDrag = null;
                }
            }
        }, { passive: false });

        document.addEventListener('touchend', function() {
            if (swipeState.isSwiping && swipeState.sidebarDrag) {
                const sw = getSidebarWidth();
                const currentTranslate = parseFloat(
                    DOM.sidebar.style.transform.replace('translateX(', '').replace('px)', '') || '0'
                );
                const progress = (currentTranslate + sw) / sw; // 0=closed, 1=open
                const threshold = 0.35;

                DOM.sidebar.classList.remove('no-transition');

                if (progress > threshold) {
                    openSidebar();
                } else {
                    closeSidebar();
                }
                swipeState.isSwiping = false;
                swipeState.sidebarDrag = null;
            } else {
                swipeState.isSwiping = false;
                swipeState.sidebarDrag = null;
            }
        });
