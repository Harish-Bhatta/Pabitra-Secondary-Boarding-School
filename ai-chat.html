        // AI & CHAT LOGIC
        // ============================================================
        async function fetchAIResponse(userPrompt) {
            if (!GROQ_CONFIG.apiKey || GROQ_CONFIG.apiKey.includes('YOUR_API_KEY')) {
                return fallbackResponse(userPrompt);
            }
            try {
                const response = await fetch(GROQ_CONFIG.endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROQ_CONFIG.apiKey}`
                    },
                    body: JSON.stringify({
                        model: GROQ_CONFIG.model,
                        messages: [
                            { role: 'system',
                                content: 'You are a helpful AI assistant for Pabitra Secondary Boarding School (PSBS), Doti, Nepal. Speak warmly with respect. Answer concisely and helpfully.' },
                            { role: 'user', content: userPrompt }
                        ],
                        temperature: GROQ_CONFIG.temperature,
                        max_tokens: GROQ_CONFIG.maxTokens
                    })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (err) {
                console.warn('Groq API Error, using fallback:', err);
                return fallbackResponse(userPrompt);
            }
        }

        function fallbackResponse(q) {
            const query = q.toLowerCase();
            if (query.includes('school') || query.includes('psbs'))
                return '🌸 Pabitra Secondary Boarding School (PSBS) was established in 2040 B.S. in Doti, Nepal. Dedicated to academic excellence and moral values! Radhe Radhe!';
            if (query.includes('hello') || query.includes('hi'))
                return 'Hello! 🌸 How can I help you with school details, admissions, or questions today? Radhe Radhe!';
            if (query.includes('principal'))
                return 'Our Principal is Mr. Binod Kumar Mishra, leading PSBS with passion and vision.';
            return 'I am your PSBS AI Assistant. Feel free to ask about admissions, school history, exams, or events! Radhe Radhe 💝';
        }

        function addMessage(text, sender) {
            const welcome = DOM.chatMessages.querySelector('.chat-welcome');
            if (welcome) welcome.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${sender}`;

            let content = `<span>${text}</span><span class="msg-time">${formatTime()}</span>`;

            if (sender === 'ai') {
                content += `
                            <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
                                <button class="regenerate-btn" data-msg="${escapeHTML(text)}"><i class="ri-refresh-line"></i> Regenerate</button>
                                <button class="copy-btn" data-msg="${escapeHTML(text)}"><i class="ri-file-copy-line"></i> Copy</button>
                            </div>
                        `;
            }

            msgDiv.innerHTML = content;
            DOM.chatMessages.appendChild(msgDiv);
            scrollToBottom(true);

            state.currentMessages.push({ text, sender, time: Date.now() });

            if (sender === 'ai') {
                const regenBtn = msgDiv.querySelector('.regenerate-btn');
                const copyBtn = msgDiv.querySelector('.copy-btn');
                if (regenBtn) {
                    regenBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const originalText = this.getAttribute('data-msg');
                        const msgs = DOM.chatMessages.querySelectorAll('.chat-msg.ai');
                        if (msgs.length > 0) {
                            const lastAi = msgs[msgs.length - 1];
                            if (lastAi === msgDiv) {
                                state.currentMessages = state.currentMessages.filter(m => !(m.sender === 'ai' &&
                                    m.text === originalText && m.time === state.currentMessages[state
                                        .currentMessages.length - 1]?.time));
                                msgDiv.remove();
                                const userMsgs = state.currentMessages.filter(m => m.sender === 'user');
                                if (userMsgs.length > 0) {
                                    regenerateAI(userMsgs[userMsgs.length - 1].text);
                                }
                            }
                        }
                    });
                }
                if (copyBtn) {
                    copyBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const text = this.getAttribute('data-msg');
                        copyToClipboard(text);
                    });
                }
            }

            if (sender === 'user') {
                msgDiv.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    showContextMenu(e, this, text);
                });

                let longPressTimer = null;
                msgDiv.addEventListener('touchstart', function(e) {
                    longPressTimer = setTimeout(() => {
                        const touch = e.touches[0] || e.changedTouches[0];
                        showContextMenu({ clientX: touch.clientX, clientY: touch.clientY }, this,
                        text);
                    }, 600);
                });
                msgDiv.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
                msgDiv.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });
            }

            saveCurrentSession();
        }

        function showContextMenu(e, el, text) {
            document.querySelectorAll('.msg-context-menu').forEach(m => m.remove());

            const menu = document.createElement('div');
            menu.className = 'msg-context-menu';
            menu.style.left = Math.min(e.clientX, window.innerWidth - 150) + 'px';
            menu.style.top = Math.min(e.clientY, window.innerHeight - 120) + 'px';
            menu.innerHTML = `
                        <button data-action="edit"><i class="ri-pencil-line"></i> Edit</button>
                        <button data-action="copy"><i class="ri-file-copy-line"></i> Copy</button>
                    `;
            document.body.appendChild(menu);

            const rect = menu.getBoundingClientRect();
            if (rect.right > window.innerWidth) {
                menu.style.left = (window.innerWidth - rect.width - 10) + 'px';
            }
            if (rect.bottom > window.innerHeight) {
                menu.style.top = (window.innerHeight - rect.height - 10) + 'px';
            }

            menu.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = this.getAttribute('data-action');
                    if (action === 'edit') {
                        const newText = prompt('Edit your message:', text);
                        if (newText && newText.trim()) {
                            const idx = state.currentMessages.findIndex(m => m.text === text && m
                                .sender === 'user');
                            if (idx !== -1) {
                                state.currentMessages[idx].text = newText.trim();
                                const msgSpan = el.querySelector('span:first-child');
                                if (msgSpan) msgSpan.textContent = newText.trim();
                                el.querySelectorAll('[data-msg]').forEach(el2 => {
                                    el2.setAttribute('data-msg', escapeHTML(newText.trim()));
                                });
                                saveCurrentSession();
                                showToast('Message edited ✏️', '✏️');
                            }
                        }
                    } else if (action === 'copy') {
                        copyToClipboard(text);
                    }
                    menu.remove();
                });
            });

            setTimeout(() => {
                document.addEventListener('click', function closeMenu(e) {
                    if (!menu.contains(e.target)) {
                        menu.remove();
                        document.removeEventListener('click', closeMenu);
                    }
                });
            }, 10);

            setTimeout(() => { if (menu.parentNode) menu.remove(); }, 5000);
        }

        async function regenerateAI(userText) {
            state.isTyping = true;
            showTyping();
            const response = await fetchAIResponse(userText);
            hideTyping();
            addMessage(response, 'ai');
            state.isTyping = false;
        }

        function showTyping() {
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            DOM.chatMessages.appendChild(indicator);
            scrollToBottom(true);
        }

        function hideTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function ensureSessionId() {
            if (!state.currentSessionId) {
                state.currentSessionId = generateId();
            }
        }

        function getSessionTitle() {
            const firstUserMsg = state.currentMessages.find(m => m.sender === 'user');
            if (firstUserMsg) {
                const t = firstUserMsg.text.trim();
                return t.length > 35 ? t.slice(0, 32) + '...' : t;
            }
            return 'New Chat';
        }

        function saveCurrentSession() {
            if (state.currentMessages.length === 0) return;
            ensureSessionId();
            const title = getSessionTitle();
            const existingIdx = state.history.findIndex(h => h.id === state.currentSessionId);
            const sessionData = {
                id: state.currentSessionId,
                title,
                messages: [...state.currentMessages],
                timestamp: Date.now()
            };
            if (existingIdx >= 0) {
                state.history[existingIdx] = sessionData;
            } else {
                state.history.unshift(sessionData);
            }
            localStorage.setItem(LOCAL_KEYS.HISTORY, JSON.stringify(state.history));
            renderHistory();
        }

        async function handleSend() {
            const text = DOM.chatInput.value.trim();
            if (!text || state.isTyping) return;

            DOM.chatInput.value = '';
            autoResizeTextarea();
            addMessage(text, 'user');
            ensureSessionId();

            state.isTyping = true;
            DOM.sendBtn.disabled = true;
            showTyping();

            DOM.chatInput.focus();

            const response = await fetchAIResponse(text);

            hideTyping();
            addMessage(response, 'ai');
            state.isTyping = false;
            DOM.sendBtn.disabled = false;

            saveCurrentSession();
            DOM.chatInput.focus();
        }

        function renderWelcome() {
            const initial = (state.user.name || 'G').charAt(0).toUpperCase();
            const color = getColorFromName(state.user.name);
            DOM.chatMessages.innerHTML = `
                        <div class="chat-welcome">
                            <div class="welcome-avatar" style="${state.user.avatar ? `background-image:url(${state.user.avatar});` : `background-color:${color};`}">${state.user.avatar ? '' : initial}</div>
                            <div class="welcome-text-content">
                                <h2>Namaste, ${state.user.name}! 🌸</h2>
                                <p>How can I assist you with Pabitra Secondary Boarding School today?</p>
                            </div>
                        </div>
                    `;
        }

        function startNewChat() {
            state.currentSessionId = null;
            state.currentMessages = [];
            renderWelcome();
            DOM.chatInput.value = '';
            autoResizeTextarea();
            closeSidebar();
            showToast('Started new chat session ✨', '✨');
            DOM.chatInput.focus();
        }

        // ============================================================
        // HISTORY
        // ============================================================
        function renderHistory() {
            if (state.history.length === 0) {
                DOM.historyContainer.innerHTML =
                    '<div style="text-align:center;color:var(--text-light);font-size:0.8rem;padding:20px 0;">No chat history yet</div>';
                return;
            }

            DOM.historyContainer.innerHTML = state.history.map(item => `
                        <div class="history-item" data-id="${item.id}">
                            <span class="history-title"><i class="ri-chat-3-line"></i> ${escapeHTML(item.title)}</span>
                            <button class="h-more-btn" data-id="${item.id}" aria-label="Chat options"><i class="ri-more-2-fill"></i></button>
                            <div class="history-dropdown" id="dropdown-${item.id}">
                                <button class="rename-h-btn" data-id="${item.id}"><i class="ri-pencil-line"></i> Rename</button>
                                <button class="danger delete-h-btn" data-id="${item.id}"><i class="ri-delete-bin-line"></i> Delete</button>
                            </div>
                        </div>
                    `).join('');

            DOM.historyContainer.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.h-more-btn') || e.target.closest('.history-dropdown')) return;
                    const id = el.getAttribute('data-id');
                    loadHistorySession(id);
                });
            });

            DOM.historyContainer.querySelectorAll('.h-more-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    const targetDD = document.getElementById(`dropdown-${id}`);
                    document.querySelectorAll('.history-dropdown').forEach(dd => {
                        if (dd !== targetDD) dd.classList.remove('active');
                    });
                    targetDD.classList.toggle('active');
                });
            });

            DOM.historyContainer.querySelectorAll('.rename-h-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    const item = state.history.find(h => h.id === id);
                    if (item) {
                        state.pendingRenameId = id;
                        DOM.renameChatInput.value = item.title;
                        DOM.renameChatModal.classList.add('active');
                        DOM.renameChatInput.focus();
                        document.querySelectorAll('.history-dropdown').forEach(dd => dd.classList.remove(
                        'active'));
                    }
                });
            });

            DOM.historyContainer.querySelectorAll('.delete-h-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    state.history = state.history.filter(h => h.id !== id);
                    if (state.currentSessionId === id) {
                        state.currentSessionId = null;
                        state.currentMessages = [];
                        renderWelcome();
                    }
                    localStorage.setItem(LOCAL_KEYS.HISTORY, JSON.stringify(state.history));
                    renderHistory();
                    showToast('Chat deleted 🗑️', '🗑️');
                    document.querySelectorAll('.history-dropdown').forEach(dd => dd.classList.remove('active'));
                });
            });
        }

        function loadHistorySession(id) {
            const session = state.history.find(h => h.id === id);
            if (!session) return;
            state.currentSessionId = session.id;
            state.currentMessages = [...session.messages];
            DOM.chatMessages.innerHTML = '';
            session.messages.forEach(m => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `chat-msg ${m.sender}`;
                const timeStr = new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                let content = `<span>${m.text}</span><span class="msg-time">${timeStr}</span>`;
                if (m.sender === 'ai') {
                    content += `
                                <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
                                    <button class="regenerate-btn" data-msg="${escapeHTML(m.text)}"><i class="ri-refresh-line"></i> Regenerate</button>
                                    <button class="copy-btn" data-msg="${escapeHTML(m.text)}"><i class="ri-file-copy-line"></i> Copy</button>
                                </div>
                            `;
                }
                msgDiv.innerHTML = content;
                DOM.chatMessages.appendChild(msgDiv);

                if (m.sender === 'ai') {
                    const regenBtn = msgDiv.querySelector('.regenerate-btn');
                    const copyBtn = msgDiv.querySelector('.copy-btn');
                    if (regenBtn) {
                        regenBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const originalText = this.getAttribute('data-msg');
                            const msgs = DOM.chatMessages.querySelectorAll('.chat-msg.ai');
                            if (msgs.length > 0) {
                                const lastAi = msgs[msgs.length - 1];
                                if (lastAi === msgDiv) {
                                    state.currentMessages = state.currentMessages.filter(m => !(m
                                        .sender === 'ai' && m.text === originalText && m.time ===
                                        state.currentMessages[state.currentMessages.length - 1]
                                        ?.time));
                                    msgDiv.remove();
                                    const userMsgs = state.currentMessages.filter(m => m.sender ===
                                        'user');
                                    if (userMsgs.length > 0) {
                                        regenerateAI(userMsgs[userMsgs.length - 1].text);
                                    }
                                }
                            }
                        });
                    }
                    if (copyBtn) {
                        copyBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const text = this.getAttribute('data-msg');
                            copyToClipboard(text);
                        });
                    }
                }

                if (m.sender === 'user') {
                    msgDiv.addEventListener('contextmenu', function(e) {
                        e.preventDefault();
                        showContextMenu(e, this, m.text);
                    });
                    let longPressTimer = null;
                    msgDiv.addEventListener('touchstart', function(e) {
                        longPressTimer = setTimeout(() => {
                            const touch = e.touches[0] || e.changedTouches[0];
                            showContextMenu({ clientX: touch.clientX, clientY: touch.clientY },
                                this, m.text);
                        }, 600);
                    });
                    msgDiv.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
                    msgDiv.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });
                }
            });
            scrollToBottom(true);
            closeSidebar();
            showToast('Chat loaded 📂', '📂');
        }

        // ============================================================
        // MODALS
        // ============================================================
        function openEditNameModal() {
            DOM.editNameInput.value = state.user.name;
            DOM.editNameModal.classList.add('active');
            state.isEditModalOpen = true;
            state.panelOpen = true;
            state.openCount++;
            document.body.classList.add('modal-active');
            DOM.editNameInput.focus();
        }

        function closeEditNameModal() {
            DOM.editNameModal.classList.remove('active');
            state.isEditModalOpen = false;
            state.panelOpen = false;
            document.body.classList.remove('modal-active');
            if (state.openCount > 0) state.openCount--;
        }

        function openThemePresetsModal() {
            renderThemePresetsGrid();
            DOM.themePresetsModal.classList.add('active');
            state.isThemePresetsOpen = true;
            state.panelOpen = true;
            state.openCount++;
            document.body.classList.add('modal-active');
        }

        function closeThemePresetsModal() {
            DOM.themePresetsModal.classList.remove('active');
            state.isThemePresetsOpen = false;
            state.panelOpen = false;
            document.body.classList.remove('modal-active');
            if (state.openCount > 0) state.openCount--;
        }

        // ============================================================
        // PROFILE DROPDOWN
        // ============================================================
        function toggleProfileDropdown(e) {
            e.stopPropagation();
            if (state.panelOpen && !state.isDropdownOpen) return;
            const isOpen = DOM.profileDropdown.classList.contains('active');
            if (!isOpen) {
                DOM.profileDropdown.classList.add('active');
                state.isDropdownOpen = true;
                state.panelOpen = true;
                state.openCount++;
                document.body.classList.add('dropdown-active');
                document.body.style.overflow = 'hidden';
                DOM.profileBtn.setAttribute('aria-expanded', 'true');
            } else {
                closeProfileDropdown();
            }
        }

        function closeProfileDropdown() {
            DOM.profileDropdown.classList.remove('active');
            state.isDropdownOpen = false;
            state.panelOpen = false;
            document.body.classList.remove('dropdown-active');
            if (!state.isSidebarOpen && !state.isEditModalOpen && !state.isThemePresetsOpen) {
                document.body.style.overflow = '';
            }
            if (state.openCount > 0) state.openCount--;
            DOM.profileBtn.setAttribute('aria-expanded', 'false');
        }

        // ============================================================
        // KEYBOARD DETECTION
        // ============================================================
        function setupKeyboardDetection() {
            if (window.visualViewport) {
                let prevHeight = window.visualViewport.height;
                let isKeyboardOpen = false;
                window.visualViewport.addEventListener('resize', () => {
                    const currentHeight = window.visualViewport.height;
                    const diff = prevHeight - currentHeight;
                    if (diff > 80) {
                        if (!isKeyboardOpen) {
                            isKeyboardOpen = true;
                            DOM.chatMain.classList.add('keyboard-open');
                        }
                    } else if (diff < -80) {
                        if (isKeyboardOpen) {
                            isKeyboardOpen = false;
                            DOM.chatMain.classList.remove('keyboard-open');
                            void DOM.chatMain.offsetHeight;
                            requestAnimationFrame(() => { void DOM.chatMain.offsetHeight; });
                        }
                    }
                    prevHeight = currentHeight;
                });
            }
            DOM.chatInput.addEventListener('focus', () => {
                DOM.chatMain.classList.add('keyboard-open');
            });
            DOM.chatInput.addEventListener('blur', () => {
                DOM.chatMain.classList.remove('keyboard-open');
                void DOM.chatMain.offsetHeight;
                requestAnimationFrame(() => { void DOM.chatMain.offsetHeight; });
            });
        }

        // ============================================================
        // INIT
        // ============================================================
        function initApp() {
            loadTheme();
            loadProfile();

            const storedHistory = localStorage.getItem(LOCAL_KEYS.HISTORY);
            if (storedHistory) {
                try { state.history = JSON.parse(storedHistory); } catch (e) {}
            }
            renderHistory();
            renderWelcome();

            setupKeyboardDetection();

            // Event Listeners
            DOM.sendBtn.addEventListener('click', (e) => {
                e.preventDefault();
                handleSend();
            });

            DOM.chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            DOM.chatInput.addEventListener('input', autoResizeTextarea);

            // Sidebar
            DOM.menuBtn.addEventListener('click', toggleSidebar);
            DOM.sidebarCloseBtn.addEventListener('click', closeSidebar);
            DOM.sidebarOverlay.addEventListener('click', closeSidebar);
            DOM.newChatBtn.addEventListener('click', startNewChat);
            DOM.sidebarNewChatBtn.addEventListener('click', startNewChat);

            // Profile
            DOM.profileBtn.addEventListener('click', toggleProfileDropdown);
            document.addEventListener('click', (e) => {
                if (!DOM.profileDropdown.contains(e.target) && e.target !== DOM.profileBtn) {
                    closeProfileDropdown();
                }
            });

            // Avatar upload
            DOM.ddAvatarWrap.addEventListener('click', (e) => {
                e.stopPropagation();
                DOM.avatarUploader.click();
            });

            DOM.avatarUploader.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 3 * 1024 * 1024) return showToast('Image must be under 3MB', '❌');
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        saveProfile(state.user.name, evt.target.result);
                        showToast('Profile photo updated! 📸', '📸');
                    };
                    reader.readAsDataURL(file);
                }
                DOM.avatarUploader.value = '';
            });

            // Edit name
            DOM.ddEditNameIcon.addEventListener('click', (e) => {
                e.stopPropagation();
                closeProfileDropdown();
                openEditNameModal();
            });

            DOM.editNameCloseBtn.addEventListener('click', closeEditNameModal);
            DOM.saveNameBtn.addEventListener('click', () => {
                const newName = DOM.editNameInput.value.trim();
                if (newName) {
                    saveProfile(newName, state.user.avatar);
                    closeEditNameModal();
                    showToast('Profile updated! ✨', '✨');
                    renderWelcome();
                }
            });
            DOM.editNameModal.addEventListener('click', (e) => {
                if (e.target === DOM.editNameModal) closeEditNameModal();
            });

            // Rename chat
            DOM.renameChatCloseBtn.addEventListener('click', () => DOM.renameChatModal.classList.remove('active'));
            DOM.saveRenameChatBtn.addEventListener('click', () => {
                const newTitle = DOM.renameChatInput.value.trim();
                if (newTitle && state.pendingRenameId) {
                    const item = state.history.find(h => h.id === state.pendingRenameId);
                    if (item) {
                        item.title = newTitle;
                        localStorage.setItem(LOCAL_KEYS.HISTORY, JSON.stringify(state.history));
                        renderHistory();
                        showToast('Chat renamed ✏️', '✏️');
                    }
                }
                DOM.renameChatModal.classList.remove('active');
                state.pendingRenameId = null;
            });
            DOM.renameChatModal.addEventListener('click', (e) => {
                if (e.target === DOM.renameChatModal) {
                    DOM.renameChatModal.classList.remove('active');
                    state.pendingRenameId = null;
                }
            });

            // Theme presets
            DOM.headerThemePresetsBtn.addEventListener('click', openThemePresetsModal);
            DOM.ddThemePresetsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeProfileDropdown();
                openThemePresetsModal();
            });
            DOM.themePresetsCloseBtn.addEventListener('click', closeThemePresetsModal);
            DOM.themePresetsModal.addEventListener('click', (e) => {
                if (e.target === DOM.themePresetsModal) closeThemePresetsModal();
            });
            DOM.themePresetsApplyBtn.addEventListener('click', () => {
                if (selectedPreset) {
                    applyThemePreset(selectedPreset);
                    const label = (themePresets.find(p => p.id === selectedPreset) || themePresets[0]).label;
                    showToast(`Theme applied: ${label} 🎨`, '🎨');
                    closeThemePresetsModal();
                } else {
                    showToast('Please select a theme first', '⚠️');
                }
            });

            // Dark mode toggle
            DOM.themeToggleBtn.addEventListener('click', toggleDarkMode);

            // New chat from dropdown
            DOM.ddNewChatBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeProfileDropdown();
                startNewChat();
            });

            // Logout
            DOM.ddLogoutBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeProfileDropdown();
                localStorage.removeItem(LOCAL_KEYS.PROFILE_SYNC[0]);
                state.user = { name: 'Guest', avatar: null };
                updateProfileUI();
                renderWelcome();
                showToast('Logged out 👋', '👋');
            });

            // Fix for history dropdown close on outside click
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.history-dropdown') && !e.target.closest('.h-more-btn')) {
                    document.querySelectorAll('.history-dropdown').forEach(dd => dd.classList.remove('active'));
                }
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    DOM.chatInput.focus();
                }
                if (e.key === 'Escape') {
                    if (state.isEditModalOpen) closeEditNameModal();
                    else if (state.isThemePresetsOpen) closeThemePresetsModal();
                    else if (state.isDropdownOpen) closeProfileDropdown();
                    else if (state.isSidebarOpen) closeSidebar();
                    else if (DOM.renameChatModal.classList.contains('active')) {
                        DOM.renameChatModal.classList.remove('active');
                        state.pendingRenameId = null;
                    }
                }
            });

            console.log('🌸 PSBS AI Chat initialized');
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
