<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="description" content="AI Chat Assistant — Pabitra Secondary Boarding School" />
  <meta name="theme-color" content="#f39c12" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <link rel="icon" type="image/png" href="school.jpg" />
  <title>AI Chat — PSBS</title>
  <style>
    /* ── ROOT VARIABLES ── */
    :root {
      --primary: #f39c12;
      --primary-dark: #d68910;
      --primary-light: #f5b041;
      --primary-gradient: linear-gradient(145deg, #f39c12, #f7c948);
      --primary-glow: rgba(243, 156, 18, 0.30);
      --background: #f0f2f8;
      --surface: rgba(255, 255, 255, 0.55);
      --surface-solid: #ffffff;
      --surface-hover: rgba(255, 255, 255, 0.80);
      --text: #0b1222;
      --text-light: #5a6a7e;
      --border: rgba(255, 255, 255, 0.35);
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 12px 48px rgba(0, 0, 0, 0.06);
      --radius-sm: 14px;
      --radius-md: 22px;
      --radius-lg: 28px;
      --radius-full: 9999px;
      --msg-radius: 22px;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 16px 56px rgba(0, 0, 0, 0.10);
      --shadow-xl: 0 24px 72px rgba(0, 0, 0, 0.14);
      --font-family: 'Plus Jakarta Sans', sans-serif;
      --header-height: 60px;
      --chat-msg-user-bg: var(--primary-gradient);
      --chat-msg-user-color: #ffffff;
      --chat-msg-ai-bg: rgba(255, 255, 255, 0.78);
      --chat-msg-ai-color: var(--text);
      --z-header: 100;
      --z-sidebar: 200;
      --z-modal: 500;
      --z-toast: 1000;
      --z-dropdown: 300;
      --sb-width: 88vw;
      --sb-inner-padding: 16px;
      --container-padding: 16px;
      --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
      --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --glass-shine: linear-gradient(135deg, rgba(255, 255, 255, 0.40) 0%, rgba(255, 255, 255, 0) 60%);
    }
    body.dark {
      --background: #0a0e1a;
      --surface: rgba(16, 24, 44, 0.70);
      --surface-solid: #111827;
      --surface-hover: rgba(30, 41, 75, 0.80);
      --text: #f1f5f9;
      --text-light: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.06);
      --chat-msg-ai-bg: rgba(20, 30, 55, 0.80);
      --chat-msg-ai-color: #f1f5f9;
      --primary-glow: rgba(243, 156, 18, 0.18);
    }
    body.theme-cyan { --primary: #06b6d4; --primary-dark: #0891b2; --primary-light: #67e8f9; --primary-gradient: linear-gradient(145deg, #06b6d4, #67e8f9); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(6, 182, 212, 0.30); }
    body.theme-coral { --primary: #e85d75; --primary-dark: #c0394b; --primary-light: #f1948a; --primary-gradient: linear-gradient(145deg, #e85d75, #f1948a); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(232, 93, 117, 0.30); }
    body.theme-indigo { --primary: #4f46e5; --primary-dark: #4338ca; --primary-light: #818cf8; --primary-gradient: linear-gradient(145deg, #4f46e5, #818cf8); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(79, 70, 229, 0.30); }
    body.theme-rose { --primary: #e11d48; --primary-dark: #be123c; --primary-light: #fb7185; --primary-gradient: linear-gradient(145deg, #e11d48, #fb7185); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(225, 29, 72, 0.30); }
    body.theme-teal { --primary: #27ae9e; --primary-dark: #1f8a7a; --primary-light: #48c9b0; --primary-gradient: linear-gradient(145deg, #27ae9e, #48c9b0); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(39, 174, 158, 0.30); }
    body.theme-red { --primary: #e74c3c; --primary-dark: #c0392b; --primary-light: #f1948a; --primary-gradient: linear-gradient(145deg, #e74c3c, #f1948a); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(231, 76, 60, 0.30); }
    body.theme-yellow { --primary: #f1c40f; --primary-dark: #d4ac0d; --primary-light: #f7dc6f; --primary-gradient: linear-gradient(145deg, #f1c40f, #f7dc6f); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(241, 196, 15, 0.30); }
    body.dark.theme-cyan { --primary: #06b6d4; --primary-dark: #0891b2; --primary-light: #67e8f9; --primary-gradient: linear-gradient(145deg, #06b6d4, #67e8f9); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(6, 182, 212, 0.20); }
    body.dark.theme-coral { --primary: #e85d75; --primary-dark: #c0394b; --primary-light: #f1948a; --primary-gradient: linear-gradient(145deg, #e85d75, #f1948a); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(232, 93, 117, 0.20); }
    body.dark.theme-indigo { --primary: #4f46e5; --primary-dark: #4338ca; --primary-light: #818cf8; --primary-gradient: linear-gradient(145deg, #4f46e5, #818cf8); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(79, 70, 229, 0.20); }
    body.dark.theme-rose { --primary: #e11d48; --primary-dark: #be123c; --primary-light: #fb7185; --primary-gradient: linear-gradient(145deg, #e11d48, #fb7185); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(225, 29, 72, 0.20); }
    body.dark.theme-teal { --primary: #27ae9e; --primary-dark: #1f8a7a; --primary-light: #48c9b0; --primary-gradient: linear-gradient(145deg, #27ae9e, #48c9b0); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(39, 174, 158, 0.20); }
    body.dark.theme-red { --primary: #e74c3c; --primary-dark: #c0392b; --primary-light: #f1948a; --primary-gradient: linear-gradient(145deg, #e74c3c, #f1948a); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(231, 76, 60, 0.20); }
    body.dark.theme-yellow { --primary: #f1c40f; --primary-dark: #d4ac0d; --primary-light: #f7dc6f; --primary-gradient: linear-gradient(145deg, #f1c40f, #f7dc6f); --chat-msg-user-bg: var(--primary-gradient); --primary-glow: rgba(241, 196, 15, 0.20); }

    /* ── RESET ── */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100dvh; width:100vw; overflow:hidden; font-family:var(--font-family); background:var(--background); color:var(--text); -webkit-tap-highlight-color:transparent; user-select:none; }

    /* ── NEBULA BG ── */
    .nebula-bg { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
    .nebula-bg .orb { position:absolute; border-radius:var(--radius-full); filter:blur(120px); animation:float 26s ease-in-out infinite alternate; opacity:0.45; }
    .nebula-bg .orb:nth-child(1) { width:480px; height:480px; top:-160px; left:-160px; background:var(--primary-glow); }
    .nebula-bg .orb:nth-child(2) { width:400px; height:400px; bottom:-120px; right:-120px; background:rgba(6,182,212,0.12); }
    .nebula-bg .orb:nth-child(3) { width:240px; height:240px; top:40%; left:60%; background:rgba(236,72,153,0.10); animation-duration:30s; animation-delay:-8s; }
    @keyframes float { 0% { transform:translate(0,0) scale(1); } 100% { transform:translate(50px,-40px) scale(1.15); } }

    #app { display:flex; flex-direction:column; height:100dvh; width:100%; position:relative; overflow:hidden; }

    /* ── HEADER — completely transparent, no background, no border, floating ── */
    .header {
      height:var(--header-height);
      background:transparent !important;
      backdrop-filter:none !important;
      -webkit-backdrop-filter:none !important;
      border-bottom:none !important;
      z-index:var(--z-header);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 12px;
      flex-shrink:0;
      position:absolute; /* absolute so chat flows behind */
      top:0; left:0; right:0;
      pointer-events:none; /* allow clicks to pass through to chat, but buttons need pointer-events auto */
      box-shadow:none !important;
    }
    .header .nav-left, .header .nav-right {
      pointer-events:auto; /* re-enable clicks on buttons */
    }
    .header::after, .header::before { display:none !important; }

    /* Make header buttons slightly more visible with glass effect */
    .icon-btn, .header-theme-toggle-btn, .header-theme-presets-btn, .profile-btn {
      background:var(--glass-bg) !important;
      backdrop-filter:blur(12px) !important;
      -webkit-backdrop-filter:blur(12px) !important;
      border:1px solid var(--border) !important;
      box-shadow:0 2px 12px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.4) !important;
    }
    body.dark .icon-btn, body.dark .header-theme-toggle-btn, body.dark .header-theme-presets-btn, body.dark .profile-btn {
      background:rgba(0,0,0,0.3) !important;
      border-color:rgba(255,255,255,0.1) !important;
    }

    .nav-left, .nav-right { display:flex; align-items:center; gap:6px; position:relative; z-index:2; }

    .icon-btn {
      width:40px; height:40px; border-radius:var(--radius-full);
      color:var(--text);
      display:grid; place-items:center; font-size:1.05rem; cursor:pointer;
      transition:transform 0.15s ease, background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      flex-shrink:0;
    }
    .icon-btn:active { transform:scale(0.88); }
    .icon-btn:hover { background:var(--primary-gradient) !important; color:#fff; border-color:transparent; box-shadow:0 6px 24px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.35); }
    .icon-btn.glow-btn { background:var(--primary-gradient); color:#fff; border-color:transparent; box-shadow:0 6px 24px var(--primary-glow); }
    .icon-btn.glow-btn:hover { transform:scale(1.04); box-shadow:0 8px 36px var(--primary-glow); }
    .header-theme-toggle-btn, .header-theme-presets-btn {
      width:36px; height:36px; border-radius:var(--radius-full);
      color:var(--text);
      display:grid; place-items:center; font-size:1rem; cursor:pointer;
      transition:all 0.3s ease; flex-shrink:0;
    }
    .header-theme-toggle-btn:hover, .header-theme-presets-btn:hover { background:var(--primary-gradient) !important; color:#fff; border-color:transparent; box-shadow:0 6px 24px var(--primary-glow); }

    .profile-container { position:relative; pointer-events:auto; }
    .profile-btn {
      width:36px; height:36px; border-radius:var(--radius-full);
      background:var(--primary-gradient); color:#fff; font-weight:700; font-size:0.85rem;
      border:2px solid rgba(255,255,255,0.25);
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      overflow:hidden; background-size:cover; background-position:center;
      flex-shrink:0; transition:transform 0.15s ease, box-shadow 0.3s ease;
      box-shadow:0 4px 16px rgba(0,0,0,0.04);
    }
    .profile-btn:active { transform:scale(0.88); }
    .profile-btn:hover { box-shadow:0 6px 28px var(--primary-glow); }

    /* ── PROFILE DROPDOWN ── */
    .profile-dropdown {
      position:absolute; top:48px; right:0; width:280px;
      background:var(--surface-solid);
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      box-shadow:var(--shadow-lg);
      padding:6px 0;
      z-index:var(--z-dropdown);
      display:none; opacity:0;
      transform:translateY(-8px) scale(0.96);
      transition:all 0.3s var(--transition-smooth);
      backdrop-filter:blur(40px) saturate(200%);
      -webkit-backdrop-filter:blur(40px) saturate(200%);
    }
    body.dark .profile-dropdown { background:var(--surface-solid); }
    .profile-dropdown.active { display:block; opacity:1; transform:translateY(0) scale(1); }
    .dropdown-profile-header { padding:10px 14px 8px; display:flex; align-items:center; gap:10px; }
    .dropdown-avatar-wrap { position:relative; flex-shrink:0; cursor:pointer; border-radius:var(--radius-full); transition:transform 0.3s ease; }
    .dropdown-avatar-wrap:hover { transform:scale(1.04); }
    .dropdown-avatar-wrap .avatar-edit-badge { position:absolute; bottom:-2px; right:-2px; width:20px; height:20px; border-radius:var(--radius-full); background:var(--primary); color:#fff; font-size:0.5rem; display:flex; align-items:center; justify-content:center; border:2px solid var(--surface-solid); box-shadow:0 2px 8px rgba(0,0,0,0.12); }
    .dropdown-avatar { width:44px; height:44px; border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.9rem; color:#fff; background-size:cover; background-position:center; background-color:var(--primary); flex-shrink:0; }
    .dropdown-user-meta { flex:1; min-width:0; display:flex; flex-direction:column; }
    .dropdown-user-meta .name-row { display:flex; align-items:center; gap:6px; }
    .dropdown-user-meta .name-row h4 { font-size:0.85rem; font-weight:700; color:var(--text); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dropdown-user-meta .name-row .edit-name-icon { font-size:0.7rem; color:#fff; background:var(--primary); cursor:pointer; transition:all 0.3s ease; padding:2px; border-radius:var(--radius-full); display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; }
    .dropdown-user-meta .name-row .edit-name-icon:hover { transform:scale(1.15); }
    .dropdown-user-meta .role-badge { font-size:0.55rem; font-weight:600; color:var(--primary); background:rgba(243,156,18,0.08); padding:1px 10px; border-radius:16px; width:max-content; }
    .dropdown-divider { height:1px; background:var(--border); margin:4px 12px; }
    .dropdown-item { display:flex; align-items:center; gap:10px; padding:8px 14px; color:var(--text); font-size:0.75rem; font-weight:500; transition:all 0.2s ease; width:100%; text-align:left; cursor:pointer; border:none; background:none; border-radius:0; }
    .dropdown-item i { font-size:0.9rem; color:var(--text-light); width:20px; text-align:center; flex-shrink:0; }
    .dropdown-item:hover { background:rgba(243,156,18,0.06); color:var(--primary); }
    .dropdown-item.danger { color:#EF4444; }
    .dropdown-item.danger:hover { background:rgba(239,68,68,0.06); color:#EF4444; }

    /* ── SIDEBAR — sharp corners, smooth close ── */
    .sidebar-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.30); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      opacity:0; visibility:hidden;
      transition:opacity 0.40s var(--transition-smooth), visibility 0.40s var(--transition-smooth);
      z-index:calc(var(--z-sidebar) - 1);
    }
    .sidebar-overlay.active { opacity:1; visibility:visible; }

    .sidebar {
      position:fixed; top:0; bottom:0; left:0;
      width:var(--sb-width); max-width:360px;
      background:var(--surface);
      backdrop-filter:blur(48px) saturate(220%);
      -webkit-backdrop-filter:blur(48px) saturate(220%);
      border-right:1px solid var(--glass-border);
      z-index:var(--z-sidebar);
      transform:translateX(-102%);
      transition:transform 0.45s var(--transition-smooth);
      display:flex; flex-direction:column;
      will-change:transform;
      box-shadow:20px 0 80px rgba(0,0,0,0.08);
      border-radius:0;
      overflow:hidden;
    }
    .sidebar::after { content:''; position:absolute; inset:0; background:var(--glass-shine); pointer-events:none; opacity:0.12; border-radius:0; }
    .sidebar.active { transform:translateX(0); }
    .sidebar.no-transition { transition:none !important; }

    .sidebar-header { padding:8px var(--sb-inner-padding); border-bottom:1px solid var(--glass-border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; min-height:58px; position:relative; z-index:2; }
    .sidebar-brand { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
    .sidebar-logo { width:38px; height:38px; border-radius:var(--radius-full); object-fit:cover; flex-shrink:0; border:2px solid rgba(255,255,255,0.15); }
    .sidebar-text h2 { margin:0; font-size:1rem; font-weight:800; color:var(--text); line-height:1.2; }
    .sidebar-text p { font-size:0.7rem; margin:0; color:var(--text-light); opacity:0.7; }
    .sidebar-close { width:34px; height:34px; min-width:34px; border:1px solid var(--glass-border); border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; color:var(--text); background:var(--glass-bg); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:all 0.3s var(--transition-smooth); font-size:16px; flex-shrink:0; cursor:pointer; }
    .sidebar-close:hover { background:rgba(239,68,68,0.10); color:#EF4444; transform:rotate(90deg); }

    .sidebar-body { flex:1; overflow-y:auto; padding:12px var(--sb-inner-padding) 8px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; position:relative; z-index:2; }
    .sidebar-group-title { display:flex; align-items:center; gap:12px; padding-left:4px; margin-top:4px; }
    .sidebar-group-title span:first-child { font-size:0.55rem; font-weight:800; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-light); white-space:nowrap; opacity:0.6; }
    .title-line { flex:1; height:1px; background:linear-gradient(90deg, var(--border) 0%, transparent 100%); }
    .history-count-badge { font-size:0.6rem; color:var(--text-light); opacity:0.55; flex-shrink:0; }

    .history-container { display:flex; flex-direction:column; gap:4px; flex:1; }
    .history-empty { text-align:center; color:var(--text-light); font-size:0.8rem; padding:24px 8px; opacity:0.75; }
    .history-group-title { margin-top:12px; }
    .history-group-title:first-child { margin-top:0; }
    .history-item { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:var(--radius-sm); background:var(--glass-bg); border:1px solid var(--glass-border); cursor:pointer; transition:all 0.25s var(--transition-smooth); position:relative; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); box-shadow:0 1px 2px rgba(0,0,0,0.02); }
    .history-item:hover { background:var(--surface-hover); transform:translateX(2px); box-shadow:0 4px 14px rgba(0,0,0,0.05); }
    .history-item:active { transform:translateX(2px) scale(0.98); }
    .history-item .history-title { font-size:0.8rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; margin-right:8px; display:flex; align-items:center; gap:6px; }
    .history-item .history-title i { color:var(--text-light); font-size:0.8rem; flex-shrink:0; }
    .history-item .history-title .pin-icon { color:var(--primary); font-size:0.7rem; flex-shrink:0; }
    .history-item .history-time { font-size:0.55rem; color:var(--text-light); flex-shrink:0; margin-right:4px; opacity:0.6; }
    .history-item.pinned { background:rgba(243,156,18,0.05); border-left:3px solid var(--primary); }

    .history-context-menu { position:fixed; background:var(--surface-solid); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); padding:4px; z-index:100; min-width:140px; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); display:none; animation:fadeIn 0.15s ease-out; }
    .history-context-menu.active { display:block; }
    .history-context-menu button { width:100%; padding:8px 12px; border:none; background:transparent; color:var(--text); font-size:0.75rem; font-weight:500; display:flex; align-items:center; gap:8px; border-radius:6px; cursor:pointer; transition:background 0.15s ease; font-family:inherit; }
    .history-context-menu button:hover { background:var(--surface-hover); }
    .history-context-menu button i { font-size:0.9rem; color:var(--text-light); width:18px; text-align:center; }
    .history-context-menu button.danger { color:#EF4444; }
    .history-context-menu button.danger:hover { background:rgba(239,68,68,0.06); }

    .sidebar-footer-wrap { padding:8px var(--sb-inner-padding) 12px; display:flex; flex-direction:column; gap:8px; flex-shrink:0; border-top:1px solid var(--glass-border); position:relative; z-index:2; }
    .glass-divider { height:1px; background:linear-gradient(90deg, transparent, var(--border) 50%, transparent); }
    .footer-meta-flex { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
    .spiritual-branding { display:inline-flex; align-items:center; gap:4px; }
    .heart-pulse-icon { color:#EC4899; font-size:0.7rem; animation:heartbeat 1.4s ease infinite; }
    @keyframes heartbeat { 0%,100%{transform:scale(1);} 30%{transform:scale(1.15);} 60%{transform:scale(1.10);} }
    .gradient-signature-text { font-size:0.6rem; font-weight:700; background:linear-gradient(45deg, #EC4899, #4f46e5, #f39c12); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:gradientText 4s linear infinite; }
    @keyframes gradientText { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
    .footer-actions { display:flex; gap:4px; }
    .footer-actions button { background:none; border:none; color:var(--text-light); cursor:pointer; font-size:0.8rem; padding:2px 6px; border-radius:4px; transition:all 0.2s ease; }
    .footer-actions button:hover { background:var(--glass-bg); color:var(--text); }

    /* ── CHAT MAIN ── */
    .chat-main {

    .chat-msg .msg-time { font-size:0.55rem; opacity:0.5; margin-top:4px; display:block; text-align:right; font-weight:400; }
    .chat-msg.user .msg-time { color:rgba(255,255,255,0.7); }
    .chat-msg.ai .msg-time { color:var(--text-light); }
    .chat-msg.ai .md-content p { margin:0 0 6px 0; }
    .chat-msg.ai .md-content p:last-child { margin-bottom:0; }
    .chat-msg.ai .md-content code { background:rgba(0,0,0,0.06); padding:1px 6px; border-radius:4px; font-size:0.82em; font-family:'JetBrains Mono', monospace; }
    body.dark .chat-msg.ai .md-content code { background:rgba(255,255,255,0.06); }
    .chat-msg.ai .md-content pre { background:rgba(0,0,0,0.06); padding:10px 12px; border-radius:8px; overflow-x:auto; margin:6px 0; font-size:0.78rem; font-family:'JetBrains Mono', monospace; line-height:1.5; }
    body.dark .chat-msg.ai .md-content pre { background:rgba(255,255,255,0.06); }
    .chat-msg.ai .md-content ul, .chat-msg.ai .md-content ol { padding-left:20px; margin:4px 0 6px 0; }
    .chat-msg.ai .md-content li { margin-bottom:2px; }

    .chat-msg.ai .md-content a { color:var(--primary); text-decoration:underline; text-underline-offset:2px; }

    .chat-msg.ai .md-content h1 { font-size:1.1rem; }
    .chat-msg.ai .md-content h2 { font-size:1rem; }
    .chat-msg.ai .md-content h3 { font-size:0.92rem; }

    .msg-actions { display:flex; gap:4px; margin-top:4px; opacity:0.3; transition:opacity 0.25s ease; flex-wrap:wrap; align-items:center; }
    .msg-wrapper:hover .msg-actions { opacity:1; }
    .msg-actions button { width:28px; height:28px; border-radius:var(--radius-full); border:1px solid var(--border); background:var(--glass-bg); color:var(--text-light); display:grid; place-items:center; font-size:0.75rem; cursor:pointer; transition:all 0.2s ease; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
    .msg-actions button:hover { background:var(--primary-gradient); color:#fff; border-color:transparent; transform:scale(1.06); }
    .msg-actions button.liked { color:#EC4899; border-color:#EC4899; background:rgba(236,72,153,0.08); }
    .msg-actions button.disliked { color:#EF4444; border-color:#EF4444; background:rgba(239,68,68,0.08); }
    .msg-actions button.speaking { color:var(--primary); border-color:var(--primary); animation:pulse 0.8s ease-in-out infinite; }
    @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.12);} 100%{transform:scale(1);} }
    .msg-wrapper.user .msg-actions { display:none; }
    .msg-context-menu { position:fixed; background:var(--surface-solid); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); padding:4px; z-index:100; min-width:130px; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); display:none; animation:fadeIn 0.15s ease-out; }
    .msg-context-menu.active { display:block; }
    .msg-context-menu button { width:100%; padding:8px 12px; border:none; background:transparent; color:var(--text); font-size:0.75rem; font-weight:500; display:flex; align-items:center; gap:8px; border-radius:6px; cursor:pointer; transition:background 0.15s ease; font-family:inherit; }
    .msg-context-menu button:hover { background:var(--surface-hover); }
    .msg-context-menu button i { font-size:0.9rem; color:var(--text-light); width:18px; text-align:center; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }

    .chat-welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; gap:8px; }

    .welcome-text-content h2 { font-size:1.15rem; font-weight:700; margin-bottom:2px; }

    .welcome-shortcuts .chip { font-size:0.6rem; padding:4px 12px; border-radius:var(--radius-full); background:var(--glass-bg); border:1px solid var(--border); color:var(--text-light); cursor:pointer; transition:all 0.2s ease; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }

    .chat-main.keyboard-open .welcome-text-content { opacity:0; max-height:0; margin:0; overflow:hidden; }

    /* ── CHAT INPUT ── */
    .chat-input-wrap { padding:8px 10px max(10px, env(safe-area-inset-bottom)); background:var(--surface); backdrop-filter:blur(36px) saturate(220%); -webkit-backdrop-filter:blur(36px) saturate(220%); border-top:1px solid var(--border); display:flex; align-items:flex-end; gap:8px; flex-shrink:0; border-radius:var(--radius-md) var(--radius-md) 0 0; box-shadow:0 -8px 40px rgba(0,0,0,0.02); position:relative; }

    .chat-textarea-wrap .input-actions button:hover { background:var(--primary-gradient); color:#fff; }
    .send-btn { width:44px; height:44px; border-radius:var(--radius-full); border:none; background:var(--primary-gradient); color:#fff; font-size:1.2rem; display:grid; place-items:center; cursor:pointer; flex-shrink:0; box-shadow:0 6px 24px var(--primary-glow); transition:transform 0.15s ease, opacity 0.15s ease, box-shadow 0.3s ease; align-self:flex-end; margin-bottom:1px; }
    .send-btn:active { transform:scale(0.88); }
    .send-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .send-btn:hover:not(:disabled) { box-shadow:0 8px 36px var(--primary-glow); transform:translateY(-2px); }

    .typing-indicator { align-self:flex-start; display:flex; gap:4px; padding:11px 17px; background:var(--chat-msg-ai-bg); border-radius:var(--msg-radius); border-bottom-left-radius:8px; border:1px solid var(--glass-border); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
    .typing-indicator span { width:6px; height:6px; border-radius:var(--radius-full); background:var(--text-light); animation:bounce 1.2s infinite ease-in-out; }
    .typing-indicator span:nth-child(2) { animation-delay:0.2s; }

    @keyframes bounce { 0%,80%,100% { transform:translateY(0); } 40% { transform:translateY(-6px); } }

    .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px) scale(0.92); background:var(--surface); backdrop-filter:blur(36px) saturate(220%); -webkit-backdrop-filter:blur(36px) saturate(220%); color:var(--text); padding:12px 24px; border-radius:var(--radius-full); border:1px solid var(--border); box-shadow:var(--shadow-lg); font-size:0.8rem; font-weight:600; opacity:0; pointer-events:none; transition:all 0.4s var(--transition-bounce); z-index:var(--z-toast); display:flex; align-items:center; gap:8px; min-width:160px; justify-content:center; }

    .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.50); backdrop-filter:blur(32px) saturate(200%); -webkit-backdrop-filter:blur(32px) saturate(200%); z-index:var(--z-modal); display:none; place-items:center; padding:20px; }
    .modal-overlay.active { display:grid; }
    .modal-card { width:100%; max-width:360px; background:var(--surface); backdrop-filter:blur(48px) saturate(220%); -webkit-backdrop-filter:blur(48px) saturate(220%); border-radius:var(--radius-lg); border:1px solid var(--glass-border); padding:24px 20px; box-shadow:var(--shadow-xl); transform:scale(0.92) translateY(20px); transition:transform 0.4s var(--transition-bounce), opacity 0.3s ease; opacity:0; }
    .modal-overlay.active .modal-card { transform:scale(1) translateY(0); opacity:1; }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .modal-title { font-size:1rem; font-weight:700; background:var(--primary-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .modal-close { border:none; background:var(--glass-bg); color:var(--text); font-size:1.1rem; cursor:pointer; width:32px; height:32px; border-radius:var(--radius-full); display:grid; place-items:center; transition:all 0.3s ease; border:1px solid var(--glass-border); }
    .modal-close:hover { background:rgba(239,68,68,0.10); color:#EF4444; transform:rotate(90deg); }
    .modal-input { width:100%; height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--border); background:var(--background); color:var(--text); margin-bottom:14px; outline:none; font-family:inherit; font-size:0.9rem; transition:border-color 0.2s ease; }
    .modal-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-glow); }
    .modal-save-btn { width:100%; height:42px; border:none; border-radius:12px; background:var(--primary-gradient); color:#fff; font-weight:700; cursor:pointer; font-family:inherit; font-size:0.9rem; transition:all 0.3s ease; box-shadow:0 4px 16px var(--primary-glow); }
    .modal-save-btn:hover { transform:translateY(-2px); box-shadow:0 6px 28px var(--primary-glow); }

    .theme-presets-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0; }
    .theme-option { background:var(--surface); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:2px solid var(--border); border-radius:var(--radius-sm); padding:10px 6px; text-align:center; cursor:pointer; transition:all 0.3s var(--transition-smooth); position:relative; }
    .theme-option:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--primary); }
    .theme-option.active-theme { border-color:var(--primary); background:var(--primary-glow); box-shadow:0 0 0 3px var(--primary-glow); }
    .theme-option .theme-swatch { width:36px; height:36px; border-radius:var(--radius-full); margin:0 auto 4px; border:2px solid var(--border); transition:transform 0.3s ease; }
    .theme-option:hover .theme-swatch { transform:scale(1.06); }
    .theme-option .theme-name { font-size:0.65rem; font-weight:600; color:var(--text); }
    .theme-option .theme-check { position:absolute; top:4px; right:4px; width:18px; height:18px; border-radius:var(--radius-full); background:var(--primary); color:#fff; display:none; align-items:center; justify-content:center; font-size:0.5rem; }
    .theme-option.active-theme .theme-check { display:flex; }

    @media (min-width:600px) { .chat-messages { padding:20px 12%; } .chat-input-wrap { padding:10px 12% max(12px, env(safe-area-inset-bottom)); } .msg-wrapper { max-width:70%; } .toast { min-width:200px; } }
    @media (min-width:768px) { .chat-messages { padding:24px 18%; } .chat-input-wrap { padding:12px 18% max(14px, env(safe-area-inset-bottom)); } .msg-wrapper { max-width:65%; } }
    @media (min-width:1024px) { .chat-messages { padding:28px 22%; } .chat-input-wrap { padding:14px 22% max(16px, env(safe-area-inset-bottom)); } .msg-wrapper { max-width:55%; } }
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--primary); border-radius:999px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--primary-dark); }
    .hidden { display:none !important; }
  </style>
</head>

  // ── MARKDOWN RENDERER (unchanged) ──
  function renderMarkdown(text) {
    let html = text;
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => `<pre><code class="language-${lang||'text'}">${escapeHTML(code.trim())}</code></pre>`);
    html = html.replace(/`([^`]+)`/g, (match, code) => `<code>${escapeHTML(code)}</code>`);
    html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');
    html = html.replace(/^[\*\-] (.*$)/gim, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
    html = html.replace(/^\d+\. (.*$)/gim, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>)/s, '<ol>$1</ol>');
    html = html.replace(/\n\n/g, '</p><p>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<p><\/p>/g, '');
    html = html.replace(/<p>\s*<ul>/g, '<ul>');
    html = html.replace(/<\/ul>\s*<\/p>/g, '</ul>');
    html = html.replace(/<p>\s*<ol>/g, '<ol>');
    html = html.replace(/<\/ol>\s*<\/p>/g, '</ol>');
    html = html.replace(/<p>\s*<blockquote>/g, '<blockquote>');
    html = html.replace(/<\/blockquote>\s*<\/p>/g, '</blockquote>');
    html = html.replace(/<p>\s*<h1>/g, '<h1>');
    html = html.replace(/<\/h1>\s*<\/p>/g, '</h1>');
    html = html.replace(/<p>\s*<h2>/g, '<h2>');
    html = html.replace(/<\/h2>\s*<\/p>/g, '</h2>');
    html = html.replace(/<p>\s*<h3>/g, '<h3>');
    html = html.replace(/<\/h3>\s*<\/p>/g, '</h3>');
    return html;
  }

  function historyGroupTitleHTML(label){ return `<div class="sidebar-group-title history-group-title"><span>${escapeHTML(label)}</span><span class="title-line" aria-hidden="true"></span></div>`; }
  function historyItemHTML(item){ const pinnedClass=item.pinned?'pinned':''; const pinIcon=item.pinned?'<span class="pin-icon">📌</span>':''; return `<div class="history-item ${pinnedClass}" data-id="${item.id}"><span class="history-title">${pinIcon}<i class="ri-chat-3-line"></i> ${escapeHTML(item.title)}</span><span class="history-time">${relativeTime(item.timestamp)}</span></div>`; }
  function renderHistory(filter){ const query=(filter||state.searchQuery||'').toLowerCase().trim(); let items=state.history; if(query){ items=items.filter(h=>h.title.toLowerCase().includes(query)||h.messages.some(m=>m.text.toLowerCase().includes(query))); } items=[...items].sort((a,b)=>{ if(a.pinned && !b.pinned) return -1; if(!a.pinned && b.pinned) return 1; return b.timestamp-a.timestamp; }); if(items.length===0){ DOM.historyContainer.innerHTML=`<div class="history-empty">${query?'No matches found 🔍':'No chat history yet'}</div>`; if(DOM.historyCount) DOM.historyCount.textContent=''; return; } let html=''; const pinnedItems=items.filter(i=>i.pinned); const otherItems=items.filter(i=>!i.pinned); if(pinnedItems.length){ html+=historyGroupTitleHTML('📌 Pinned'); for(const item of pinnedItems) html+=historyItemHTML(item); } let lastGroup=null; for(const item of otherItems){ const group=getDateGroup(item.timestamp); if(group!==lastGroup){ html+=historyGroupTitleHTML(group); lastGroup=group; } html+=historyItemHTML(item); } DOM.historyContainer.innerHTML=html; if(DOM.historyCount) DOM.historyCount.textContent=`${items.length}`; DOM.historyContainer.querySelectorAll('.history-item').forEach(el=>{ el.addEventListener('click',function(e){ const id=this.getAttribute('data-id'); loadHistorySession(id); }); let longPressTimer=null; el.addEventListener('touchstart',function(e){ longPressTimer=setTimeout(()=>{ const touch=e.touches[0]||e.changedTouches[0]; const id=this.getAttribute('data-id'); showHistoryContextMenu({clientX:touch.clientX,clientY:touch.clientY},id); },600); }); el.addEventListener('touchend',function(){ clearTimeout(longPressTimer); }); el.addEventListener('touchmove',function(){ clearTimeout(longPressTimer); }); el.addEventListener('contextmenu',function(e){ e.preventDefault(); const id=this.getAttribute('data-id'); showHistoryContextMenu(e,id); }); }); }

  // ── AI & CHAT ──
  const SYSTEM_PROMPT = 'You are a helpful AI assistant for Pabitra Secondary Boarding School (PSBS), Doti, Nepal. Speak warmly with respect. Format your responses with markdown where appropriate (bold, lists, code, etc.). CRITICAL: when asked for a list, table, or enumeration with a known length (e.g. "48 laws of power", "10 tips"), you must include every single item, in order, with the exact count requested. Never stop partway through, never summarize or skip remaining items, and never write "and so on" instead of finishing. If the full answer is long, that is fine — write all of it.';
  async function callGroq(messages){ const response=await fetch(GROQ_CONFIG.endpoint,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_CONFIG.apiKey}`}, body:JSON.stringify({ model:GROQ_CONFIG.model, messages, temperature:GROQ_CONFIG.temperature, max_completion_tokens:GROQ_CONFIG.maxTokens, reasoning_effort:GROQ_CONFIG.reasoningEffort, }) }); if(!response.ok) throw new Error(`HTTP ${response.status}`); const data=await response.json(); const choice=data.choices&&data.choices[0]; return { text:(choice&&choice.message&&choice.message.content)||'', finishReason:choice&&choice.finish_reason, }; }
  async function fetchAIResponse(userPrompt){ if(!GROQ_CONFIG.apiKey||GROQ_CONFIG.apiKey.includes('YOUR_API_KEY')){ return fallbackResponse(userPrompt); } try { const historyMessages=[{role:'system',content:SYSTEM_PROMPT}]; const history=state.currentMessages; const startIdx=Math.max(0,history.length-CONFIG.CONTEXT_WINDOW); for(let i=startIdx;i<history.length;i++){ const msg=history[i]; historyMessages.push({ role:msg.sender==='user'?'user':'assistant', content:msg.text }); } historyMessages.push({role:'user',content:userPrompt}); let {text,finishReason}=await callGroq(historyMessages); let full=text||''; let attempts=0; while(finishReason==='length' && attempts<GROQ_CONFIG.maxContinuations){ attempts++; historyMessages.push({role:'assistant',content:full}); historyMessages.push({role:'user',content:'Continue your previous answer exactly where you left off. Do not repeat anything already written and do not restart numbering.'}); const cont=await callGroq(historyMessages); full+=cont.text||''; finishReason=cont.finishReason; } return full.trim()||fallbackResponse(userPrompt); } catch(err){ console.warn('Groq API Error, using fallback:',err); return fallbackResponse(userPrompt); } }
  function fallbackResponse(q){ const query=q.toLowerCase(); if(query.includes('school')||query.includes('psbs')) return '🌸 **Pabitra Secondary Boarding School (PSBS)** was established in 2040 B.S. in Doti, Nepal. Dedicated to academic excellence and moral values! Radhe Radhe!'; if(query.includes('hello')||query.includes('hi')) return 'Hello! 🌸 How can I help you with school details, admissions, or questions today? Radhe Radhe!'; if(query.includes('principal')) return 'Our Principal is **Mr. Binod Kumar Mishra**, leading PSBS with passion and vision.'; if(query.includes('48 laws')) return 'Here are the **48 Laws of Power** (full list):\n\n1. Never outshine the master\n2. Never put too much trust in friends, learn how to use enemies\n3. Conceal your intentions\n4. Always say less than necessary\n5. So much depends on reputation — guard it with your life\n6. Court attention at all cost\n7. Get others to do the work for you, but always take the credit\n8. Make other people come to you — use bait if necessary\n9. Win through your actions, never through argument\n10. Infection: avoid the unhappy and unlucky\n11. Learn to keep people dependent on you\n12. Use selective honesty and generosity to disarm your victim\n13. When asking for help, appeal to people\'s self-interest, never to their mercy or gratitude\n14. Pose as a friend, work as a spy\n15. Crush your enemy totally\n16. Use absence to increase respect and honor\n17. Keep others in suspended terror: cultivate an air of unpredictability\n18. Do not build fortresses to protect yourself — isolation is dangerous\n19. Know who you\'re dealing with — do not offend the wrong person\n20. Do not commit to anyone\n21. Play a sucker to catch a sucker — seem dumber than your mark\n22. Use the surrender tactic: transform weakness into power\n23. Concentrate your forces\n24. Play the perfect courtier\n25. Re-create yourself\n26. Keep your hands clean\n27. Play on people\'s need to believe to create a cultlike following\n28. Enter action with boldness\n29. Plan all the way to the end\n30. Make your accomplishments seem effortless\n31. Control the options: get others to play with the cards you deal\n32. Play to people\'s fantasies\n33. Discover each man\'s thumbscrew\n34. Be royal in your own fashion: act like a king to be treated like one\n35. Master the art of timing\n36. Disdain things you cannot have: ignoring them is the best revenge\n37. Create compelling spectacles\n38. Think as you like but behave like others\n39. Stir up waters to catch fish\n40. Despise the free lunch\n41. Avoid stepping into a great man\'s shoes\n42. Strike the shepherd and the sheep will scatter\n43. Work on the hearts and minds of others\n44. Disarm and infuriate with the mirror effect\n45. Preach the need for change, but never reform too much at once\n46. Never appear too perfect\n47. Do not go past the mark you aimed for; in victory, learn when to stop\n48. Assume formlessness'; return 'I am your PSBS AI Assistant. Feel free to ask about admissions, school history, exams, or events! Radhe Radhe 💝'; }

  function addMessage(text, sender, timestamp){ const welcome=DOM.chatMessages.querySelector('.chat-welcome'); if(welcome) welcome.remove(); const msgId=generateId(); const time=timestamp||Date.now(); const wrapper=document.createElement('div'); wrapper.className=`msg-wrapper ${sender}`; wrapper.setAttribute('data-msg-id',msgId); const bubble=document.createElement('div'); bubble.className=`chat-msg ${sender}`; let content=''; if(sender==='ai'){ content=`<div class="md-content">${renderMarkdown(text)}</div>`; } else { content=`<span>${escapeHTML(text)}</span>`; } content+=`<span class="msg-time">${relativeTime(time)}</span>`; bubble.innerHTML=content; wrapper.appendChild(bubble); if(sender==='ai'){ const actions=document.createElement('div'); actions.className='msg-actions'; actions.innerHTML=`<button class="regen-btn" data-msg-id="${msgId}" title="Regenerate"><i class="ri-refresh-line"></i></button><button class="copy-btn" data-msg="${escapeHTML(text)}" title="Copy"><i class="ri-file-copy-line"></i></button><button class="like-btn" data-msg-id="${msgId}" title="Like"><i class="ri-heart-line"></i></button><button class="dislike-btn" data-msg-id="${msgId}" title="Dislike"><i class="ri-thumb-down-line"></i></button><button class="speak-btn" data-msg="${escapeHTML(text)}" title="Speak Aloud"><i class="ri-volume-up-line"></i></button>`; wrapper.appendChild(actions); const regenBtn=actions.querySelector('.regen-btn'); const copyBtn=actions.querySelector('.copy-btn'); const likeBtn=actions.querySelector('.like-btn'); const dislikeBtn=actions.querySelector('.dislike-btn'); const speakBtn=actions.querySelector('.speak-btn'); if(regenBtn){ regenBtn.addEventListener('click',function(e){ e.stopPropagation(); const id=this.getAttribute('data-msg-id'); const msgs=DOM.chatMessages.querySelectorAll('.msg-wrapper.ai'); if(msgs.length>0){ const lastAi=msgs[msgs.length-1]; if(lastAi.getAttribute('data-msg-id')===id){ const origMsg=state.currentMessages.find(m=>m.id===id); if(origMsg){ state.currentMessages=state.currentMessages.filter(m=>m.id!==id); lastAi.remove(); const userMsgs=state.currentMessages.filter(m=>m.sender==='user'); if(userMsgs.length>0){ regenerateAI(userMsgs[userMsgs.length-1].text); } } } } }); } if(copyBtn){ copyBtn.addEventListener('click',function(e){ e.stopPropagation(); const txt=this.getAttribute('data-msg'); copyToClipboard(txt); }); } if(likeBtn){ likeBtn.addEventListener('click',function(e){ e.stopPropagation(); const id=this.getAttribute('data-msg-id'); toggleReaction(id,'like'); updateReactionUI(id); }); } if(dislikeBtn){ dislikeBtn.addEventListener('click',function(e){ e.stopPropagation(); const id=this.getAttribute('data-msg-id'); toggleReaction(id,'dislike'); updateReactionUI(id); }); } if(speakBtn){ speakBtn.addEventListener('click',function(e){ e.stopPropagation(); const txt=this.getAttribute('data-msg'); toggleSpeak(txt,this); }); } updateReactionUI(msgId); } DOM.chatMessages.appendChild(wrapper); scrollToBottom(true); state.currentMessages.push({id:msgId,text,sender,time}); if(sender==='user'){ wrapper.addEventListener('contextmenu',function(e){ e.preventDefault(); showMessageContextMenu(e,this,text); }); let longPressTimer=null; wrapper.addEventListener('touchstart',function(e){ longPressTimer=setTimeout(()=>{ const touch=e.touches[0]||e.changedTouches[0]; showMessageContextMenu({clientX:touch.clientX,clientY:touch.clientY},this,text); },600); }); wrapper.addEventListener('touchend',function(){ clearTimeout(longPressTimer); }); wrapper.addEventListener('touchmove',function(){ clearTimeout(longPressTimer); }); } saveCurrentSession(); return msgId; }

  function toggleReaction(msgId,type){ if(!state.reactions[msgId]) state.reactions[msgId]={liked:false,disliked:false}; const r=state.reactions[msgId]; if(type==='like'){ if(r.liked) r.liked=false; else { r.liked=true; r.disliked=false; } } else if(type==='dislike'){ if(r.disliked) r.disliked=false; else { r.disliked=true; r.liked=false; } } saveReactions(); }
  function updateReactionUI(msgId){ const wrapper=DOM.chatMessages.querySelector(`.msg-wrapper[data-msg-id="${msgId}"]`); if(!wrapper) return; const reactions=getMessageReactions(msgId); const likeBtn=wrapper.querySelector('.like-btn'); const dislikeBtn=wrapper.querySelector('.dislike-btn'); if(likeBtn){ likeBtn.classList.toggle('liked',reactions.liked); likeBtn.querySelector('i').className=reactions.liked?'ri-heart-fill':'ri-heart-line'; } if(dislikeBtn){ dislikeBtn.classList.toggle('disliked',reactions.disliked); dislikeBtn.querySelector('i').className=reactions.disliked?'ri-thumb-down-fill':'ri-thumb-down-line'; } }
  function showMessageContextMenu(e,wrapper,text){ document.querySelectorAll('.msg-context-menu').forEach(m=>m.remove()); const menu=document.createElement('div'); menu.className='msg-context-menu'; menu.style.left=Math.min(e.clientX,window.innerWidth-150)+'px'; menu.style.top=Math.min(e.clientY,window.innerHeight-120)+'px'; menu.innerHTML=`<button data-action="edit"><i class="ri-pencil-line"></i> Edit</button><button data-action="copy"><i class="ri-file-copy-line"></i> Copy</button>`; document.body.appendChild(menu); const rect=menu.getBoundingClientRect(); if(rect.right>window.innerWidth) menu.style.left=(window.innerWidth-rect.width-10)+'px'; if(rect.bottom>window.innerHeight) menu.style.top=(window.innerHeight-rect.height-10)+'px'; menu.querySelectorAll('button').forEach(btn=>{ btn.addEventListener('click',function(e){ e.stopPropagation(); const action=this.getAttribute('data-action'); if(action==='edit'){ const newText=prompt('Edit your message:',text); if(newText && newText.trim()){ const idx=state.currentMessages.findIndex(m=>m.text===text && m.sender==='user'); if(idx!==-1){ state.currentMessages[idx].text=newText.trim(); const bubble=wrapper.querySelector('.chat-msg'); if(bubble){ const span=bubble.querySelector('span:first-child'); if(span) span.textContent=newText.trim(); } saveCurrentSession(); showToast('Message edited ✏️','✏️'); } } } else if(action==='copy'){ copyToClipboard(text); } menu.remove(); }); }); setTimeout(()=>{ document.addEventListener('click',function closeMenu(e){ if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click',closeMenu); } }); },10); setTimeout(()=>{ if(menu.parentNode) menu.remove(); },5000); }

  function generateChatTitle(messages){ const userMsgs=messages.filter(m=>m.sender==='user'); if(userMsgs.length===0) return 'New Chat'; const combined=userMsgs.slice(0,3).map(m=>m.text.toLowerCase()).join(' '); const keywords=[{words:['school','psbs','pabitra','academy','education','learning'],title:'🏫 School Info'},{words:['hello','hi','namaste','hey','greetings'],title:'👋 Greeting'},{words:['contact','phone','email','address','location','call','reach'],title:'📞 Contact Info'},{words:['principal','teacher','staff','faculty','headmaster','sir','madam'],title:'👨‍🏫 Staff Info'},{words:['exam','result','test','marks','grade','score','pass','fail'],title:'📝 Exams & Results'},{words:['admission','enroll','join','fee','tuition','cost','scholarship'],title:'📋 Admissions'},{words:['sport','game','tournament','cricket','football','volleyball'],title:'⚽ Sports'},{words:['event','program','function','festival','celebration'],title:'🎉 Events'},{words:['library','book','read','study','resource'],title:'📚 Library'},{words:['hostel','dorm','resident','living','room'],title:'🏠 Hostel'},{words:['club','activity','extra','hobby','society'],title:'🌟 Clubs & Activities'},{words:['48 laws','power','law'],title:'📖 48 Laws of Power'}]; for(const group of keywords){ for(const word of group.words){ if(combined.includes(word)) return group.title; } } const first=userMsgs[0].text.trim(); return first.length>30?first.slice(0,28)+'…':first; }
  function saveCurrentSession(){ if(state.currentMessages.length===0) return; ensureSessionId(); const title=getSessionTitle(); const existingIdx=state.history.findIndex(h=>h.id===state.currentSessionId); const sessionData={ id:state.currentSessionId, title, messages:state.currentMessages.map(m=>({...m})), timestamp:Date.now(), pinned:existingIdx>=0?state.history[existingIdx].pinned||false:false, }; if(existingIdx>=0){ state.history[existingIdx]=sessionData; } else { state.history.unshift(sessionData); if(state.history.length>CONFIG.MAX_HISTORY) state.history.pop(); } localStorage.setItem(LOCAL_KEYS.HISTORY,JSON.stringify(state.history)); renderHistory(); }

  function renderWelcome(){ const initial=(state.user.name||'G').charAt(0).toUpperCase(); const color=getColorFromName(state.user.name); DOM.chatMessages.innerHTML=`<div class="chat-welcome"><div class="welcome-avatar" style="${state.user.avatar?`background-image:url(${state.user.avatar});`:`background-color:${color};`}">${state.user.avatar?'':initial}</div><div class="welcome-text-content"><h2>Namaste, ${state.user.name}! 🌸</h2><p>How can I assist you with Pabitra Secondary Boarding School today?</p><div class="welcome-shortcuts"><span class="chip" data-prompt="Tell me about PSBS">🏫 School Info</span><span class="chip" data-prompt="What are the admission requirements?">📋 Admissions</span><span class="chip" data-prompt="Contact details of PSBS">📞 Contact</span><span class="chip" data-prompt="What extracurricular activities are available?">🌟 Activities</span><span class="chip" data-prompt="List all 48 laws of power">📖 48 Laws</span></div></div></div>`; DOM.chatMessages.querySelectorAll('.welcome-shortcuts .chip').forEach(chip=>{ chip.addEventListener('click',function(){ DOM.chatInput.value=this.getAttribute('data-prompt'); autoResizeTextarea(); handleSend(); }); }); }

  function loadHistorySession(id){ const session=state.history.find(h=>h.id===id); if(!session) return; if(state.isSpeaking){ window.speechSynthesis.cancel(); state.isSpeaking=false; } state.currentSessionId=session.id; state.currentMessages=session.messages.map(m=>({...m})); localStorage.setItem(LOCAL_KEYS.CURRENT_SESSION,session.id); DOM.chatMessages.innerHTML=''; session.messages.forEach(m=>{ const msgId=m.id||generateId(); const wrapper=document.createElement('div'); wrapper.className=`msg-wrapper ${m.sender}`; wrapper.setAttribute('data-msg-id',msgId); const bubble=document.createElement('div'); bubble.className=`chat-msg ${m.sender}`; let content=''; if(m.sender==='ai'){ content=`<div class="md-content">${renderMarkdown(m.text)}</div>`; } else { content=`<span>${escapeHTML(m.text)}</span>`; } content+=`<span class="msg-time">${relativeTime(m.time||Date.now())}</span>`; bubble.innerHTML=content; wrapper.appendChild(bubble); if(m.sender==='ai'){ const actions=document.createElement('div'); actions.className='msg-actions'; actions.innerHTML=`<button class="regen-btn" data-msg-id="${msgId}" title="Regenerate"><i class="ri-refresh-line"></i></button><button class="copy-btn" data-msg="${escapeHTML(m.text)}" title="Copy"><i class="ri-file-copy-line"></i></button><button class="like-btn" data-msg-id="${msgId}" title="Like"><i class="ri-heart-line"></i></button><button class="dislike-btn" data-msg-id="${msgId}" title="Dislike"><i class="ri-thumb-down-line"></i></button><button class="speak-btn" data-msg="${escapeHTML(m.text)}" title="Speak Aloud"><i class="ri-volume-up-line"></i></button>`; wrapper.appendChild(actions); const regenBtn=actions.querySelector('.regen-btn'); const copyBtn=actions.querySelector('.copy-btn'); const likeBtn=actions.querySelector('.like-btn'); const dislikeBtn=actions.querySelector('.dislike-btn'); const speakBtn=actions.querySelector('.speak-btn'); if(regenBtn){ regenBtn.addEventListener('click',function(e){ e.stopPropagation(); const id2=this.getAttribute('data-msg-id'); const msgs=DOM.chatMessages.querySelectorAll('.msg-wrapper.ai'); if(msgs.length>0){ const lastAi=msgs[msgs.length-1]; if(lastAi.getAttribute('data-msg-id')===id2){ const origMsg=state.currentMessages.find(m=>m.id===id2); if(origMsg){ state.currentMessages=state.currentMessages.filter(m=>m.id!==id2); lastAi.remove(); const userMsgs=state.currentMessages.filter(m=>m.sender==='user'); if(userMsgs.length>0){ regenerateAI(userMsgs[userMsgs.length-1].text); } } } } }); } if(copyBtn){ copyBtn.addEventListener('click',function(e){ e.stopPropagation(); const txt=this.getAttribute('data-msg'); copyToClipboard(txt); }); } if(likeBtn){ likeBtn.addEventListener('click',function(e){ e.stopPropagation(); const id2=this.getAttribute('data-msg-id'); toggleReaction(id2,'like'); updateReactionUI(id2); }); } if(dislikeBtn){ dislikeBtn.addEventListener('click',function(e){ e.stopPropagation(); const id2=this.getAttribute('data-msg-id'); toggleReaction(id2,'dislike'); updateReactionUI(id2); }); } if(speakBtn){ speakBtn.addEventListener('click',function(e){ e.stopPropagation(); const txt=this.getAttribute('data-msg'); toggleSpeak(txt,this); }); } updateReactionUI(msgId); } DOM.chatMessages.appendChild(wrapper); if(m.sender==='user'){ wrapper.addEventListener('contextmenu',function(e){ e.preventDefault(); showMessageContextMenu(e,this,m.text); }); let longPressTimer=null; wrapper.addEventListener('touchstart',function(e){ longPressTimer=setTimeout(()=>{ const touch=e.touches[0]||e.changedTouches[0]; showMessageContextMenu({clientX:touch.clientX,clientY:touch.clientY},this,m.text); },600); }); wrapper.addEventListener('touchend',function(){ clearTimeout(longPressTimer); }); wrapper.addEventListener('touchmove',function(){ clearTimeout(longPressTimer); }); } }); scrollToBottom(true); closeSidebar(); showToast('Chat loaded 📂','📂'); }

  function exportChats(){ try{ const data={ version:'2.0', exportedAt:new Date().toISOString(), user:state.user, history:state.history, reactions:state.reactions, }; const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`psbs_chats_backup_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); showToast('Chats exported! 📤','📤'); } catch(e){ showToast('Export failed: '+e.message,'❌'); } }
  function importChats(file){ const reader=new FileReader(); reader.onload=function(e){ try{ const data=JSON.parse(e.target.result); if(!data.history||!Array.isArray(data.history)){ throw new Error('Invalid backup file'); } const existingIds=new Set(state.history.map(h=>h.id)); let imported=0; for(const item of data.history){ if(!existingIds.has(item.id)){ state.history.push(item); imported++; existingIds.add(item.id); } } if(data.reactions){ for(const [key,val] of Object.entries(data.reactions)){ if(!state.reactions[key]) state.reactions[key]=val; } saveReactions(); } if(data.user&&data.user.name){ saveProfile(data.user.name,data.user.avatar||state.user.avatar); } state.history.sort((a,b)=>{ if(a.pinned&&!b.pinned) return -1; if(!a.pinned&&b.pinned) return 1; return b.timestamp-a.timestamp; }); localStorage.setItem(LOCAL_KEYS.HISTORY,JSON.stringify(state.history)); renderHistory(); showToast(`Imported ${imported} chats! 📥`,'📥'); } catch(err){ showToast('Import failed: '+err.message,'❌'); } }; reader.readAsText(file); }

  // ── KEYBOARD DETECTION ──
  function setupKeyboardDetection(){ if(window.visualViewport){ let prevHeight=window.visualViewport.height; let isKeyboardOpen=false; window.visualViewport.addEventListener('resize',()=>{ const currentHeight=window.visualViewport.height; const diff=prevHeight-currentHeight; if(diff>80){ if(!isKeyboardOpen){ isKeyboardOpen=true; DOM.chatMain.classList.add('keyboard-open'); } } else if(diff<-80){ if(isKeyboardOpen){ isKeyboardOpen=false; DOM.chatMain.classList.remove('keyboard-open'); } } prevHeight=currentHeight; }); } DOM.chatInput.addEventListener('focus',()=>DOM.chatMain.classList.add('keyboard-open')); DOM.chatInput.addEventListener('blur',()=>DOM.chatMain.classList.remove('keyboard-open')); }

  // ── VOICE INPUT ──
  let recognition=null;
  function setupVoiceInput(){ if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){ DOM.voiceInputBtn.style.display='none'; return; } const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition; recognition=new SpeechRecognition(); recognition.lang='en-US'; recognition.continuous=false; recognition.interimResults=true; recognition.onresult=function(event){ let final=''; let interim=''; for(let i=event.resultIndex;i<event.results.length;i++){ const transcript=event.results[i][0].transcript; if(event.results[i].isFinal) final+=transcript; else interim+=transcript; } if(final){ DOM.chatInput.value=final; autoResizeTextarea(); handleSend(); } else if(interim){ DOM.chatInput.value=interim; autoResizeTextarea(); } }; recognition.onerror=function(event){ if(event.error==='not-allowed'){ showToast('Microphone access denied','❌'); } else { showToast('Voice input error: '+event.error,'❌'); } DOM.voiceInputBtn.querySelector('i').className='ri-microphone-line'; }; recognition.onend=function(){ DOM.voiceInputBtn.querySelector('i').className='ri-microphone-line'; }; DOM.voiceInputBtn.addEventListener('click',function(){ if(!recognition) return; if(recognition.isListening){ recognition.stop(); this.querySelector('i').className='ri-microphone-line'; } else { try{ recognition.start(); this.querySelector('i').className='ri-microphone-fill'; showToast('Listening... 🎤','🎤',2000); } catch(e){ showToast('Voice not supported','❌'); } } }); }

  // ── MODALS ──
  function openEditNameModal(){ DOM.editNameInput.value=state.user.name; DOM.editNameModal.classList.add('active'); state.isEditModalOpen=true; state.panelOpen=true; state.openCount++; document.body.classList.add('modal-active'); DOM.editNameInput.focus(); }
  function closeEditNameModal(){ DOM.editNameModal.classList.remove('active'); state.isEditModalOpen=false; state.panelOpen=false; document.body.classList.remove('modal-active'); if(state.openCount>0) state.openCount--; }
  function openThemePresetsModal(){ renderThemePresetsGrid(); DOM.themePresetsModal.classList.add('active'); state.isThemePresetsOpen=true; state.panelOpen=true; state.openCount++; document.body.classList.add('modal-active'); }
  function closeThemePresetsModal(){ DOM.themePresetsModal.classList.remove('active'); state.isThemePresetsOpen=false; state.panelOpen=false; document.body.classList.remove('modal-active'); if(state.openCount>0) state.openCount--; }
  function openExportImportModal(){ DOM.exportImportModal.classList.add('active'); state.isExportImportOpen=true; state.panelOpen=true; state.openCount++; document.body.classList.add('modal-active'); }
  function closeExportImportModal(){ DOM.exportImportModal.classList.remove('active'); state.isExportImportOpen=false; state.panelOpen=false; document.body.classList.remove('modal-active'); if(state.openCount>0) state.openCount--; }

  // ── PROFILE DROPDOWN ──
  function toggleProfileDropdown(e){ e.stopPropagation(); if(state.panelOpen&&!state.isDropdownOpen) return; const isOpen=DOM.profileDropdown.classList.contains('active'); if(!isOpen){ DOM.profileDropdown.classList.add('active'); state.isDropdownOpen=true; state.panelOpen=true; state.openCount++; document.body.classList.add('dropdown-active'); document.body.style.overflow='hidden'; DOM.profileBtn.setAttribute('aria-expanded','true'); } else { closeProfileDropdown(); } }
  function closeProfileDropdown(){ DOM.profileDropdown.classList.remove('active'); state.isDropdownOpen=false; state.panelOpen=false; document.body.classList.remove('dropdown-active'); if(!state.isSidebarOpen&&!state.isEditModalOpen&&!state.isThemePresetsOpen&&!state.isExportImportOpen){ document.body.style.overflow=''; } if(state.openCount>0) state.openCount--; DOM.profileBtn.setAttribute('aria-expanded','false'); }

  // ── KEYBOARD SHORTCUTS ──
  function setupKeyboardShortcuts(){ document.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='N'){ e.preventDefault(); startNewChat(); } if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='L'){ e.preventDefault(); toggleDarkMode(); } if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='V'){ e.preventDefault(); if(DOM.voiceInputBtn.style.display!=='none'){ DOM.voiceInputBtn.click(); } } if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='F'){ e.preventDefault(); } if(e.key==='Escape'){ if(state.isEditModalOpen) closeEditNameModal(); else if(state.isThemePresetsOpen) closeThemePresetsModal(); else if(state.isExportImportOpen) closeExportImportModal(); else if(state.isDropdownOpen) closeProfileDropdown(); else if(state.isSidebarOpen) closeSidebar(); else if(DOM.renameChatModal.classList.contains('active')){ DOM.renameChatModal.classList.remove('active'); state.pendingRenameId=null; } document.querySelectorAll('.history-context-menu').forEach(m=>m.remove()); document.querySelectorAll('.msg-context-menu').forEach(m=>m.remove()); if(state.isSpeaking){ window.speechSynthesis.cancel(); state.isSpeaking=false; resetAllSpeakButtons(); } } }); }

  // ── INIT ──
  function initApp(){ loadTheme(); loadProfile(); loadReactions(); const storedHistory=localStorage.getItem(LOCAL_KEYS.HISTORY); if(storedHistory){ try{ state.history=JSON.parse(storedHistory); }catch(e){} for(const item of state.history){ if(item.pinned===undefined) item.pinned=false; } state.history.sort((a,b)=>{ if(a.pinned&&!b.pinned) return -1; if(!a.pinned&&b.pinned) return 1; return b.timestamp-a.timestamp; }); } renderHistory(); const savedSessionId=localStorage.getItem(LOCAL_KEYS.CURRENT_SESSION); if(savedSessionId&&state.history.some(h=>h.id===savedSessionId)){ loadHistorySession(savedSessionId); } else { renderWelcome(); } setupSwipe(); setupKeyboardDetection(); setupVoiceInput(); setupKeyboardShortcuts(); DOM.sendBtn.addEventListener('click',(e)=>{ e.preventDefault(); handleSend(); }); DOM.chatInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); handleSend(); } }); DOM.chatInput.addEventListener('input',autoResizeTextarea); DOM.profileBtn.addEventListener('click',toggleProfileDropdown); document.addEventListener('click',(e)=>{ if(!DOM.profileDropdown.contains(e.target)&&e.target!==DOM.profileBtn){ closeProfileDropdown(); } }); DOM.ddAvatarWrap.addEventListener('click',(e)=>{ e.stopPropagation(); DOM.avatarUploader.click(); }); DOM.avatarUploader.addEventListener('change',(e)=>{ const file=e.target.files[0]; if(file){ if(file.size>3*1024*1024) return showToast('Image must be under 3MB','❌'); const reader=new FileReader(); reader.onload=(evt)=>{ saveProfile(state.user.name,evt.target.result); showToast('Profile photo updated! 📸','📸'); }; reader.readAsDataURL(file); } DOM.avatarUploader.value=''; }); DOM.ddEditNameIcon.addEventListener('click',(e)=>{ e.stopPropagation(); closeProfileDropdown(); openEditNameModal(); }); DOM.editNameCloseBtn.addEventListener('click',closeEditNameModal); DOM.saveNameBtn.addEventListener('click',()=>{ const newName=DOM.editNameInput.value.trim(); if(newName){ saveProfile(newName,state.user.avatar); closeEditNameModal(); showToast('Profile updated! ✨','✨'); renderWelcome(); } }); DOM.editNameModal.addEventListener('click',(e)=>{ if(e.target===DOM.editNameModal) closeEditNameModal(); }); DOM.ddThemePresetsBtn.addEventListener('click',(e)=>{ e.stopPropagation(); closeProfileDropdown(); openThemePresetsModal(); }); DOM.themePresetsCloseBtn.addEventListener('click',closeThemePresetsModal); DOM.themePresetsModal.addEventListener('click',(e)=>{ if(e.target===DOM.themePresetsModal) closeThemePresetsModal(); }); DOM.themePresetsApplyBtn.addEventListener('click',()=>{ if(selectedPreset){ applyThemePreset(selectedPreset); const label=(themePresets.find(p=>p.id===selectedPreset)||themePresets[0]).label; showToast(`Theme: ${label} 🎨`,'🎨'); closeThemePresetsModal(); } else { showToast('Select a theme','⚠️'); } }); DOM.themeToggleBtn.addEventListener('click',toggleDarkMode); DOM.ddExportImportBtn.addEventListener('click',(e)=>{ e.stopPropagation(); closeProfileDropdown(); openExportImportModal(); }); DOM.exportImportCloseBtn.addEventListener('click',closeExportImportModal); DOM.exportImportModal.addEventListener('click',(e)=>{ if(e.target===DOM.exportImportModal) closeExportImportModal(); }); DOM.exportChatsBtn.addEventListener('click',()=>{ exportChats(); closeExportImportModal(); }); DOM.importChatsBtn.addEventListener('click',()=>{ DOM.importFileInput.click(); }); DOM.importFileInput.addEventListener('change',(e)=>{ const file=e.target.files[0]; if(file){ importChats(file); closeExportImportModal(); } DOM.importFileInput.value=''; }); DOM.footerExportBtn.addEventListener('click',exportChats); DOM.footerImportBtn.addEventListener('click',()=>{ DOM.importFileInput.click(); }); DOM.ddLogoutBtn.addEventListener('click',(e)=>{ e.stopPropagation(); closeProfileDropdown(); localStorage.removeItem(LOCAL_KEYS.PROFILE_SYNC[0]); state.user={name:'Guest',avatar:null}; updateProfileUI(); renderWelcome(); showToast('Logged out 👋','👋'); }); setTimeout(()=>DOM.chatInput.focus(),400); console.log('🌸 PSBS AI Chat v5 — Transparent floating header, sharp sidebar, smooth close, dropdown fixed.'); }
  document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
