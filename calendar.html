<!DOCTYPE html>
<html lang="ne">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pabitra Secondary Boarding School - Calendar 2083</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== ROOT VARIABLES ===== */
    :root {
      --primary: #1E3A8A;
      --primary-dark: #172554;
      --primary-light: #3B82F6;
      --secondary: #3B82F6;
      --accent: #F59E0B;
      --accent-dark: #D97706;
      --background: #F8FAFC;
      --surface: rgba(255, 255, 255, 0.72);
      --surface-solid: #FFFFFF;
      --surface-hover: #F1F5F9;
      --text: #1F2937;
      --text-light: #6B7280;
      --text-inverse: #FFFFFF;
      --border: rgba(229, 231, 235, 0.5);
      --border-light: #F3F4F6;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-full: 50%;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.12);
      --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.15);
      --shadow-glow: 0 0 40px rgba(59, 130, 246, 0.15);
      --transition: 0.3s ease;
      --transition-smooth: 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      --font-family: 'Poppins', 'Mukta', sans-serif;
      --header-height: 54px;
      --z-header: 1000;
      --z-modal: 10000;
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --nebula-color-1: #1E3A8A;
      --nebula-color-2: #3B82F6;
      --nebula-color-3: #F59E0B;
      --holiday-red: #dc2626;
      --holiday-bg: #fef2f2;
      --today-border: #2563eb;
      --today-bg: #eff6ff;
      --prog-green: #059669;
      --event-blue: #0284c7;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }

    body.theme-purple {
      --primary: #7C3AED;
      --primary-dark: #5B21B6;
      --primary-light: #8B5CF6;
      --secondary: #8B5CF6;
      --nebula-color-1: #7C3AED;
      --nebula-color-2: #8B5CF6;
      --nebula-color-3: #C084FC;
    }

    body.theme-emerald {
      --primary: #059669;
      --primary-dark: #047857;
      --primary-light: #34D399;
      --secondary: #059669;
      --nebula-color-1: #059669;
      --nebula-color-2: #34D399;
      --nebula-color-3: #6EE7B7;
    }

    body.theme-rose {
      --primary: #E11D48;
      --primary-dark: #BE123C;
      --primary-light: #FB7185;
      --secondary: #E11D48;
      --nebula-color-1: #E11D48;
      --nebula-color-2: #FB7185;
      --nebula-color-3: #FDA4AF;
    }

    body.theme-amber {
      --primary: #D97706;
      --primary-dark: #B45309;
      --primary-light: #F59E0B;
      --secondary: #D97706;
      --nebula-color-1: #D97706;
      --nebula-color-2: #F59E0B;
      --nebula-color-3: #FCD34D;
    }

    body.theme-teal {
      --primary: #0D9488;
      --primary-dark: #0F766E;
      --primary-light: #2DD4BF;
      --secondary: #0D9488;
      --nebula-color-1: #0D9488;
      --nebula-color-2: #2DD4BF;
      --nebula-color-3: #5EEAD4;
    }

    body.theme-indigo {
      --primary: #4F46E5;
      --primary-dark: #4338CA;
      --primary-light: #818CF8;
      --secondary: #4F46E5;
      --nebula-color-1: #4F46E5;
      --nebula-color-2: #818CF8;
      --nebula-color-3: #A5B4FC;
    }

    body.theme-coral {
      --primary: #E85D75;
      --primary-dark: #C0394A;
      --primary-light: #F1948A;
      --secondary: #E85D75;
      --nebula-color-1: #E85D75;
      --nebula-color-2: #F1948A;
      --nebula-color-3: #F5B7B1;
    }

    body.dark {
      --background: #0F172A;
      --surface: rgba(30, 41, 59, 0.8);
      --surface-solid: #1E293B;
      --surface-hover: #2D3A52;
      --text: #F8FAFC;
      --text-light: #94A3B8;
      --text-inverse: #1F2937;
      --border: rgba(51, 65, 85, 0.6);
      --border-light: #1E293B;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
      --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.6);
      --shadow-glow: 0 0 40px rgba(59, 130, 246, 0.08);
      --glass-bg: rgba(30, 41, 59, 0.4);
      --glass-border: rgba(255, 255, 255, 0.04);
      --card-bg: #1E293B;
      --text-dark: #F8FAFC;
      --text-muted: #94A3B8;
      --holiday-bg: #2D1B1B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100dvh;
      transition: background 0.5s cubic-bezier(0.16, 1, 0.3, 1), color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nebula-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.6;
      transition: opacity 0.8s ease;
    }

    body.dark .nebula-bg {
      opacity: 0.8;
    }

    .nebula-bg .orb {
      position: absolute;
      border-radius: var(--radius-full);
      filter: blur(80px);
      will-change: transform;
      animation: nebulaFloat 20s ease-in-out infinite alternate;
    }

    .nebula-bg .orb:nth-child(1) {
      width: 600px;
      height: 600px;
      top: -200px;
      left: -200px;
      background: radial-gradient(circle, var(--nebula-color-1), transparent 70%);
      animation-duration: 22s;
      animation-delay: -2s;
    }

    .nebula-bg .orb:nth-child(2) {
      width: 500px;
      height: 500px;
      bottom: -150px;
      right: -150px;
      background: radial-gradient(circle, var(--nebula-color-2), transparent 70%);
      animation-duration: 26s;
      animation-delay: -5s;
    }

    .nebula-bg .orb:nth-child(3) {
      width: 400px;
      height: 400px;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, var(--nebula-color-3), transparent 70%);
      animation-duration: 30s;
      animation-delay: -10s;
      opacity: 0.4;
    }

    @keyframes nebulaFloat {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }

      33% {
        transform: translate(40px, -30px) scale(1.1) rotate(5deg);
      }

      66% {
        transform: translate(-20px, 40px) scale(0.95) rotate(-3deg);
      }

      100% {
        transform: translate(30px, -10px) scale(1.05) rotate(2deg);
      }
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--background);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--secondary);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    .app-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 8px;
      padding-top: calc(var(--header-height) + 8px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: var(--z-header);
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 2px 30px rgba(0, 0, 0, 0.02);
      height: var(--header-height);
      transition: background var(--transition), border var(--transition);
    }

    .header.header-hidden {
      transform: translateY(-100%);
    }

    .navbar {
      width: 100%;
      height: 100%;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .nav-left .logo {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      object-fit: cover;
      flex-shrink: 0;
    }

    .nav-left .brand-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .nav-left .brand-text span {
      display: block;
      font-size: 0.55rem;
      font-weight: 500;
      color: var(--text-light);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .header-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-full);
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      color: var(--text);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: 16px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .header-btn:hover {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      border-color: transparent;
      transform: translateY(-1px) scale(1.05);
    }

    .header-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      border-color: transparent;
    }

    .calendar-wrapper {
      background: var(--surface);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 12px 10px;
      transition: background var(--transition), border var(--transition);
    }

    .school-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-md);
      border-bottom: 3px solid var(--accent);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .school-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fbbf24;
      line-height: 1.2;
    }

    .school-title span {
      display: block;
      font-size: 0.75rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .school-contacts {
      font-size: 0.72rem;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 10px;
      border-radius: 8px;
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .controls-card {
      background: var(--surface-solid);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid var(--border);
      transition: background var(--transition), border var(--transition);
    }

    body.dark .controls-card {
      background: var(--surface-solid);
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .month-btn {
      background: var(--background);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all var(--transition);
    }

    .month-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .month-select {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--background);
      color: var(--text);
      outline: none;
      text-align: center;
      cursor: pointer;
      transition: border var(--transition);
    }

    .month-select:focus {
      border-color: var(--secondary);
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 38px;
      transition: all var(--transition);
    }

    .btn-today {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25);
    }

    .btn-today:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(59, 130, 246, 0.35);
    }

    .btn-tool {
      background: var(--background);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-tool:hover {
      background: var(--surface-hover);
      border-color: var(--secondary);
    }

    .month-header-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px 6px 4px;
      border-bottom: 1px solid var(--border);
    }

    .month-title-bs {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
    }

    .month-title-ad {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--background);
      padding: 2px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .day-header {
      text-align: center;
      font-weight: 700;
      padding: 4px 2px;
      font-size: 0.7rem;
      background: var(--background);
      border-radius: 4px;
      color: var(--text);
      line-height: 1.1;
    }

    .day-header span {
      display: block;
      font-size: 0.55rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .day-header.saturday,
    .day-header.sunday {
      color: var(--holiday-red);
      background: var(--holiday-bg);
    }

    body.dark .day-header.saturday,
    body.dark .day-header.sunday {
      color: #f87171;
      background: rgba(220, 38, 38, 0.15);
    }

    .calendar-cell {
      min-height: 52px;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      transition: all var(--transition);
    }

    .calendar-cell:hover {
      border-color: var(--secondary);
      transform: scale(1.02);
      z-index: 2;
      box-shadow: var(--shadow-md);
    }

    .calendar-cell.empty {
      background: var(--background);
      border: 1px dashed var(--border);
      cursor: default;
      pointer-events: none;
    }

    .calendar-cell.holiday {
      background: var(--holiday-bg);
      border-color: #fca5a5;
    }

    .calendar-cell.holiday .bs-day {
      color: var(--holiday-red);
    }

    .calendar-cell.today {
      border: 2px solid var(--today-border);
      background: var(--today-bg);
    }

    body.dark .calendar-cell.today {
      background: rgba(37, 99, 235, 0.15);
    }

    .calendar-cell.selected {
      border: 2px solid var(--accent);
      background: #fffbeb;
    }

    body.dark .calendar-cell.selected {
      background: rgba(245, 158, 11, 0.12);
    }

    .cell-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      line-height: 1;
    }

    .bs-day {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .ad-day {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .tithi-text {
      font-size: 0.55rem;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .indicator-dots {
      display: flex;
      gap: 2px;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .dot-holiday {
      background: var(--holiday-red);
    }

    .dot-event {
      background: var(--event-blue);
    }

    .dot-program {
      background: var(--prog-green);
    }

    .legend-bar {
      display: flex;
      justify-content: space-around;
      padding: 6px 4px 0 4px;
      margin-top: 6px;
      border-top: 1px solid var(--border);
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .detail-panel {
      background: var(--surface-solid);
      border-radius: var(--radius-md);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary-light);
      transition: background var(--transition), border var(--transition);
    }

    body.dark .detail-panel {
      background: var(--surface-solid);
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .detail-date-bs {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
    }

    .detail-date-ad {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .detail-box {
      background: var(--background);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .detail-box-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .detail-box-content {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .holiday-text {
      color: var(--holiday-red);
    }

    .programs-card {
      background: var(--surface-solid);
      border-radius: var(--radius-md);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent);
      transition: background var(--transition), border var(--transition);
    }

    body.dark .programs-card {
      background: var(--surface-solid);
    }

    .programs-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      color: var(--accent-dark);
    }

    body.dark .programs-header {
      color: #fbbf24;
    }

    .programs-header h3 {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .program-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .program-item {
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    body.dark .program-item {
      background: rgba(245, 158, 11, 0.08);
      border-left-color: #f59e0b;
    }

    .muhurta-box {
      margin-top: 8px;
      padding: 6px 10px;
      background: #fdf2f8;
      border-radius: 6px;
      border: 1px solid #fbcfe8;
      font-size: 0.78rem;
      color: #831843;
    }

    body.dark .muhurta-box {
      background: rgba(236, 72, 153, 0.08);
      border-color: #831843;
      color: #f472b6;
    }

    .footer-quote {

      applyTheme: function () {
        const theme = this.getTheme();
        const preset = this.getThemePreset();
        if (theme === 'dark') {
          document.body.classList.add('dark');
          const icon = document.getElementById('themeIcon');
          if (icon) icon.className = 'fa-solid fa-sun';
        } else {
          document.body.classList.remove('dark');
          const icon = document.getElementById('themeIcon');
          if (icon) icon.className = 'fa-solid fa-moon';
        }
        document.body.className = document.body.className.split(' ').filter(function (c) {
          return !c.startsWith('theme-');
        }).join(' ');
        if (preset !== 'default') { document.body.classList.add('theme-' + preset); }
      },
      toggleTheme: function () {
        const isDark = document.body.classList.contains('dark');
        if (isDark) {
          document.body.classList.remove('dark');
          localStorage.setItem('psbs_theme', 'light');
          const icon = document.getElementById('themeIcon');
          if (icon) icon.className = 'fa-solid fa-moon';
          this.showToast('☀️ Light mode enabled', 'info');
        } else {
          document.body.classList.add('dark');
          localStorage.setItem('psbs_theme', 'dark');
          const icon = document.getElementById('themeIcon');
          if (icon) icon.className = 'fa-solid fa-sun';
          this.showToast('🌙 Dark mode enabled', 'info');
        }
      },
      showToast: function (message, type) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = message;
        el.className = 'toast-container show ' + (type || 'info');
        clearTimeout(el._timeout);
        el._timeout = setTimeout(function () { el.classList.remove('show'); }, 3000);

        "पञ्चमी", "षष्ठी", "सप्तमी", "अष्टमी", "नवमी", "दशमी", "एकादशी", "एकादशी", "द्वादशी", "त्रयोदशी", "चतुर्दशी", "औंशी", "प्रतिपदा", "द्वितीया", "तृतीया", "चतुर्थी",
        "पञ्चमी", "षष्ठी"
      ],
      events: {

      daysCount: 30,
      startDayOfWeek: 1,
      adStartDate: new Date(2027, 2, 15),
      quote: "पुर्ण मानवताको विकास बिनाको जीवन व्यर्थ छ ।",
      programs: [{ day: 11, title: "११ देखि १९ वार्षिक परीक्षा" }, { day: 26, title: "२६ गते नतिजा प्रकाशन" }, {
        day: 28,
        title: "२८ गते शिक्षक बैठक"
      }],
      muhurta: "पास्नी मुहूर्तः २, ३, १०, १८",
      tithis: ["सप्तमी", "अष्टमी/नवमी", "दशमी", "एकादशी", "द्वादशी", "त्रयोदशी", "चतुर्दशी", "फागुपूर्णिमा", "प्रतिपदा", "द्वितीया", "तृतीया", "चतुर्थी", "पञ्चमी", "षष्ठी", "सप्तमी", "अष्टमी", "नवमी", "दशमी", "एकादशी", "द्वादशी", "त्रयोदशी", "चतुर्दशी", "औंशी", "प्रतिपदा", "द्वितीया", "तृतीया", "चतुर्थी", "पञ्चमी", "षष्ठी", "सप्तमी"

          isHoliday: false
        },
      18: {
          title: "विश्व मूर्ख दिवस (April Fools Day)",
          isHoliday: false
        },
        23: { title: "घोडे जात्रा (Ghode Jatra) / घोडे जात्रा दिवस (Ghode Jatra Diwas — Kathmandu Valley)", isHoliday: true },
        24: { title: "चैते दशैं (Chaite Dashain)", isHoliday: true },
        25: { title: "श्री राम नवमी (Shree Ram Navami)", isHoliday: true }
      }
    }];

    const nepaliNumbers = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];

    function toNepaliDigits(num) {
      return num.toString().split('').map(d => nepaliNumbers[d] || d).join('');
    }

    const dayHeaders = [
      { bs: "आइत", en: "SUN" },
      { bs: "सोम", en: "MON" },
      { bs: "मंगल", en: "TUE" },
      { bs: "बुध", en: "WED" },
      { bs: "विही", en: "THU" },
      { bs: "शुक्र", en: "FRI" },
      { bs: "शनि", en: "SAT" }
    ];

    const dayNamesFullBS = ["आइतबार", "सोमबार", "मङ्गलबार", "बुधबार", "बिहीबार", "शुक्रबार", "शनिबार"];
    const monthNamesBS = ["वैशाख", "जेठ", "असार", "श्रावण", "भदौ", "असोज", "कार्तिक", "मंसिर", "पुस", "माघ", "फागुन", "चैत्र"];

    let currentMonthIdx = 3;
    let selectedDayBS = 8;
    let TODAY = { monthIdx: 3, dayBS: 8, yearBS: 2083 };

    // ============================================================
    // CALENDAR FUNCTIONS
    // ============================================================
    function calculateTodayBS() {
      const now = new Date();
      const todayAD = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      for (let m = 0; m < 12; m++) {
        const mStart = new Date(MONTHS[m].adStartDate);
        const mEnd = new Date(mStart);
        mEnd.setDate(mEnd.getDate() + MONTHS[m].daysCount - 1);
        if (todayAD >= mStart && todayAD <= mEnd) {
          const diffTime = todayAD - mStart;
          const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
          TODAY = { monthIdx: m, dayBS: diffDays, yearBS: 2083 };
          return;
        }
      }
      TODAY = { monthIdx: 3, dayBS: 8, yearBS: 2083 };
    }

    function renderCalendar(monthIdx) {
      currentMonthIdx = monthIdx;
      const monthData = MONTHS[monthIdx];

      document.getElementById('monthTitleBS').innerText = monthData.nameBS;
      document.getElementById('monthTitleAD').innerText = monthData.nameAD;
      document.getElementById('monthSelect').value = monthIdx;
      document.getElementById('quoteText').innerText = monthData.quote;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      // Week headers
      dayHeaders.forEach((dh, idx) => {
        const header = document.createElement('div');
        header.className = `day-header ${idx === 0 || idx === 6 ? 'saturday' : ''}`;
        header.innerHTML = `${dh.bs}<span>${dh.en}</span>`;
        grid.appendChild(header);
      });

      // Empty cells
      for (let i = 0; i < monthData.startDayOfWeek; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-cell empty';
        grid.appendChild(emptyCell);
      }

      // Day cells
      for (let day = 1; day <= monthData.daysCount; day++) {
        const dayCell = document.createElement('div');
        const dayOfWeek = (monthData.startDayOfWeek + day - 1) % 7;
        const isSunOrSat = (dayOfWeek === 0 || dayOfWeek === 6);
        const eventData = monthData.events[day];
        const isHoliday = isSunOrSat || (eventData && eventData.isHoliday);
        const isToday = (monthIdx === TODAY.monthIdx && day === TODAY.dayBS);
        const isSelected = (monthIdx === currentMonthIdx && day === selectedDayBS);

        const adDate = new Date(monthData.adStartDate);
        adDate.setDate(adDate.getDate() + (day - 1));
        const adStr = `${adDate.getDate()}`;

        const programOnDay = monthData.programs.find(p => p.day === day);

        dayCell.className =
          `calendar-cell ${isHoliday ? 'holiday' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`;
        dayCell.onclick = () => selectDate(monthIdx, day);

        let dotsHTML = '';
        if (isHoliday) dotsHTML += `<span class="dot dot-holiday"></span>`;
        if (programOnDay) dotsHTML += `<span class="dot dot-program"></span>`;
        if (eventData && !eventData.isHoliday) dotsHTML += `<span class="dot dot-event"></span>`;

        const tithiText = monthData.tithis[day - 1] || "";

        dayCell.innerHTML = `
              <div class="cell-top">
                <span class="bs-day">${toNepaliDigits(day)}</span>
                <span class="ad-day">${adStr}</span>
              </div>
              <div class="tithi-text">${tithiText}</div>
              <div class="indicator-dots">${dotsHTML}</div>
            `;

        grid.appendChild(dayCell);
      }

      renderPrograms(monthData);
    }

    function renderPrograms(monthData) {
      document.getElementById('programsCardTitle').innerText = `${monthData.nameBS.split(' ')[0]} महिनाका कार्यक्रमहरू तथा बैठक`;
      const progList = document.getElementById('programList');
      progList.innerHTML = '';

      if (monthData.programs && monthData.programs.length > 0) {
        monthData.programs.forEach(p => {
          const li = document.createElement('li');
          li.className = 'program-item';
          li.innerHTML = `<i class="fa-solid fa-circle-check" style="color: var(--accent);"></i> <span>${p.title}</span>`;
          progList.appendChild(li);
        });
      } else {
        progList.innerHTML =
          `<li class="program-item"><i class="fa-solid fa-info-circle"></i> <span>यस महिना विशेष कार्यक्रम तोकिएको छैन।</span></li>`;
      }

      const muhurtaBox = document.getElementById('muhurtaBox');
      if (monthData.muhurta) {
        muhurtaBox.style.display = 'block';
        muhurtaBox.innerHTML = `<strong><i class="fa-solid fa-heart"></i> साइत/मुहूर्तः</strong> ${monthData.muhurta}`;
      } else {
        muhurtaBox.style.display = 'none';
      }
    }

    function selectDate(monthIdx, dayBS) {
      selectedDayBS = dayBS;
      const monthData = MONTHS[monthIdx];
      const dayOfWeekIdx = (monthData.startDayOfWeek + dayBS - 1) % 7;

      const adDate = new Date(monthData.adStartDate);
      adDate.setDate(adDate.getDate() + (dayBS - 1));
      const adFullStr = adDate.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

      const tithi = monthData.tithis[dayBS - 1] || "सामान्य";
      const eventInfo = monthData.events[dayBS];
      const progInfo = monthData.programs.find(p => p.day === dayBS);

      const isSunOrSat = (dayOfWeekIdx === 0 || dayOfWeekIdx === 6);
      const isHoliday = isSunOrSat || (eventInfo && eventInfo.isHoliday);

      document.getElementById('detailDateBS').innerText =
        `२०८३ ${monthNamesBS[monthIdx]} ${toNepaliDigits(dayBS)} गते, ${dayNamesFullBS[dayOfWeekIdx]}`;
      document.getElementById('detailDateAD').innerText = `${adFullStr} (${dayHeaders[dayOfWeekIdx].en})`;
      document.getElementById('detailTithi').innerText = tithi;

      let eventTxt = "Regular Working Day";
      if (eventInfo) {
        eventTxt = `${eventInfo.title} ${eventInfo.isHoliday ? 'Holiday' : ''}`;
      } else if (isSunOrSat) {
        eventTxt = "Weekly Holiday";
      }
      document.getElementById('detailEvent').innerHTML = (eventTxt.includes('Holiday') || eventTxt.includes('बिदा')) ?
        `<span class="holiday-text">${eventTxt}</span>` : eventTxt;

      let progTxt = "Regular Class";
      if (isHoliday) {
        progTxt = `<span class="holiday-text">Holiday</span>`;
      } else if (progInfo) {
        progTxt = progInfo.title;
      } else if (dayOfWeekIdx === 5) {
        progTxt = "नियमित शुक्रबारीय क्रियाकलाप (Regular Friday Activity)";
      }
      document.getElementById('detailProgram').innerHTML = progTxt;

      renderCalendar(monthIdx);
    }

    function goToToday() {
      selectDate(TODAY.monthIdx, TODAY.dayBS);
      Helpers.showToast('📅 Today: ' + MONTHS[TODAY.monthIdx].nameBS + ' ' + toNepaliDigits(TODAY.dayBS), 'info');
    }

    function searchCalendar() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('searchResults');
      container.innerHTML = '';
      if (!q) return;

      let count = 0;
      MONTHS.forEach((m, mIdx) => {
        Object.keys(m.events).forEach(d => {
          const ev = m.events[d];
          if (ev.title.toLowerCase().includes(q)) {
            count++;
            const div = document.createElement('div');
            div.className = 'search-result-item';
            div.innerHTML =
              `<strong>२०८३ ${monthNamesBS[mIdx]} ${toNepaliDigits(d)}:</strong> ${ev.title}`;
            div.onclick = () => {
              document.getElementById('searchModal').style.display = 'none';
              selectDate(mIdx, parseInt(d));
            };
            container.appendChild(div);
          }
        });
      });
      if (count === 0) container.innerHTML =
        `<div style="color: var(--text-muted); font-size: 0.8rem;">No results found.</div>`;
    }

    // ============================================================
    // THEME + HEADER
    // ============================================================
    function initTheme() {
      Helpers.applyTheme();
      if (document.body.classList.contains('dark')) {
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = 'fa-solid fa-sun';
      }
    }

    document.getElementById('themeToggleBtn').addEventListener('click', function () {
      Helpers.toggleTheme();
    });

    document.getElementById('homeBtn').addEventListener('click', function () {
      window.location.href = 'index.html';
    });

    // ============================================================
    // MIDNIGHT REFRESH
    // ============================================================
    function scheduleMidnightRefresh() {
      const now = new Date();
      const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1, 0);
      const timeUntilMidnight = tomorrow - now;
      setTimeout(() => {
        calculateTodayBS();
        selectDate(TODAY.monthIdx, TODAY.dayBS);
        scheduleMidnightRefresh();
      }, timeUntilMidnight);
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    document.getElementById('prevMonthBtn').onclick = () => { if (currentMonthIdx > 0) renderCalendar(currentMonthIdx - 1); };
    document.getElementById('nextMonthBtn').onclick = () => { if (currentMonthIdx < 11) renderCalendar(currentMonthIdx + 1); };
    document.getElementById('monthSelect').onchange = (e) => renderCalendar(parseInt(e.target.value));
    document.getElementById('todayBtn').onclick = goToToday;

    document.getElementById('searchModalBtn').onclick = () => {
      document.getElementById('searchModal').style.display = 'flex';
      document.getElementById('searchInput').focus();
    };
    document.getElementById('closeSearchModal').onclick = () => document.getElementById('searchModal').style.display = 'none';
    window.onclick = (e) => {
      if (e.target.classList.contains('modal-overlay')) e.target.style.display = 'none';
    };

    // ============================================================
    // INIT
    // ============================================================
    window.onload = () => {
      initTheme();
      calculateTodayBS();
      selectDate(TODAY.monthIdx, TODAY.dayBS);
      scheduleMidnightRefresh();
    };
  </script>
